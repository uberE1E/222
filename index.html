<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美少女 AI 棋陣：Q-Learning 覺醒之路</title>
    <style>
        :root {
            --bg-color: #0f051d;
            --panel-bg: rgba(30, 15, 50, 0.85);
            --accent-pink: #ff2a85;
            --accent-cyan: #00f0ff;
            --text-color: #f0e6ff;
        }
        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        h1 {
            margin: 10px 0;
            font-size: 24px;
            color: var(--accent-cyan);
            text-shadow: 0 0 10px var(--accent-cyan);
        }
        #gameWrapper {
            display: flex;
            gap: 20px;
            background: var(--panel-bg);
            border: 2px solid var(--accent-pink);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(255, 42, 133, 0.4);
            max-width: 1200px;
        }
        .side-panel {
            width: 280px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        canvas {
            border: 2px solid #555;
            background-color: #150a24;
            border-radius: 8px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }
        .btn {
            background: linear-gradient(45deg, var(--accent-pink), #9c27b0);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 42, 133, 0.6);
        }
        .panel-box {
            background: rgba(15, 5, 25, 0.9);
            border: 1px solid #444;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.4;
        }
        .panel-title {
            font-weight: bold;
            color: var(--accent-cyan);
            margin-bottom: 5px;
            border-bottom: 1px solid #444;
            padding-bottom: 3px;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 4px 0;
        }
        #chatBox {
            height: 90px;
            overflow-y: auto;
            background: rgba(0,0,0,0.5);
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
            color: #ff99c8;
        }
        .slider-group {
            margin: 6px 0;
        }
        .slider-group label {
            font-size: 11px;
            display: block;
            color: #aaa;
        }
        .slider-group input {
            width: 100%;
        }
    </style>
</head>
<body>

    <h1>✨ 美少女 AI 棋陣：Q-Learning 覺醒之路 ✨</h1>

    <div id="gameWrapper">
        <!-- 左側：美少女 AI 狀態與對話面板 -->
        <div class="side-panel">
            <div class="panel-box">
                <div class="panel-title">🌸 當前對手美少女</div>
                <div class="stat-row"><span id="aiName">艾莉絲 (傲嬌劍士)</span></div>
                <div id="chatBox">艾莉絲：「哼！區區人類別想輕易贏過本小姐的神經網路！」</div>
            </div>

            <div class="panel-box">
                <div class="panel-title">🧠 Q-Learning 大腦狀態</div>
                <div class="stat-row"><span>已探索狀態數:</span> <span id="qStatesCount">0</span></div>
                <div class="stat-row"><span>當前決策策略:</span> <span id="aiActionStr">思考中...</span></div>
                <div class="stat-row"><span>勝率預估:</span> <span id="winRateStr">50%</span></div>
            </div>

            <div class="panel-box">
                <div class="panel-title">🎮 玩家操作區</div>
                <button class="btn" onclick="playerMove('attack')">⚔️ 強力斬擊</button>
                <button class="btn" onclick="playerMove('defend')">🛡️ 能量防護</button>
                <button class="btn" onclick="playerMove('heal')">💚 醫療結晶</button>
            </div>
        </div>

        <!-- 中間：遊戲戰鬥畫布 -->
        <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
            <canvas id="gameCanvas" width="500" height="400"></canvas>
            <div style="font-size: 13px; color: #aaa;">使用下方訓練面板調整 AI 參數，觀察 AI 如何透過強化學習進化！</div>
        </div>

        <!-- 右側：AI 訓練與調教面板 -->
        <div class="side-panel">
            <div class="panel-box">
                <div class="panel-title">⚙️ AI 參數調教 (Hyperparameters)</div>
                <div class="slider-group">
                    <label>學習率 Alpha (α): <span id="alphaVal">0.1</span></label>
                    <input type="range" id="alphaRange" min="0.01" max="0.99" step="0.01" value="0.1" oninput="updateHyperparams()">
                </div>
                <div class="slider-group">
                    <label>折扣因數 Gamma (γ): <span id="gammaVal">0.9</span></label>
                    <input type="range" id="gammaRange" min="0.1" max="0.99" step="0.05" value="0.9" oninput="updateHyperparams()">
                </div>
                <div class="slider-group">
                    <label>探索率 Epsilon (ε): <span id="epsilonVal">0.2</span></label>
                    <input type="range" id="epsilonRange" min="0.0" max="1.0" step="0.05" value="0.2" oninput="updateHyperparams()">
                </div>
            </div>

            <div class="panel-box">
                <div class="panel-title">🎖️ 手動獎懲控制 (Shaping)</div>
                <p style="font-size: 11px; margin: 5px 0;">當 AI 表現好或壞時，手動給予反饋加速其學習：</p>
                <div style="display: flex; gap: 10px; margin-top: 8px;">
                    <button class="btn" style="background: #2ecc71; flex: 1;" onclick="manualReward(50)">👍 獎勵</button>
                    <button class="btn" style="background: #e74c3c; flex: 1;" onclick="manualReward(-50)">👎 懲罰</button>
                </div>
            </div>

            <div class="panel-box">
                <div class="panel-title">🔄 戰局控制</div>
                <button class="btn" style="width: 100%; background: #3498db;" onclick="resetMatch()">重新開始對局</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // 遊戲與 Q-Learning 核心參數
        let ALPHA = 0.1;
        let GAMMA = 0.9;
        let EPSILON = 0.2;

        let player = { name: "玩家", hp: 100, maxHp: 100, x: 100, y: 200, action: 'idle' };
        let ai = { 
            name: "艾莉絲", hp: 100, maxHp: 100, x: 400, y: 200, action: 'idle',
            dialogues: {
                intro: "哼！區區人類別想輕易贏過本小姐！",
                win: "哼，早就告訴過你本小姐是無敵的！",
                lose: "怎、怎麼可能...我的演算法竟然輸了！？",
                smart: "我已經摸透你的出招習慣了哦～"
            }
        };

        // 從 LocalStorage 載入 Q-Table，若無則初始化
        let qTable = JSON.parse(localStorage.getItem('beauty_ai_q_table')) || {};
        const ACTIONS = ['attack', 'defend', 'heal', 'charge'];

        let gameState = 'player_turn'; // player_turn, ai_turn, game_over
        let turnCount = 0;
        let lastStateStr = null;
        let lastActionStr = null;

        function updateHyperparams() {
            ALPHA = parseFloat(document.getElementById('alphaRange').value);
            GAMMA = parseFloat(document.getElementById('gammaRange').value);
            EPSILON = parseFloat(document.getElementById('epsilonRange').value);
            document.getElementById('alphaVal').innerText = ALPHA;
            document.getElementById('gammaVal').innerText = GAMMA;
            document.getElementById('epsilonVal').innerText = EPSILON;
        }

        function setAiChat(text) {
            document.getElementById('chatBox').innerText = `${ai.name}：「${text}」`;
        }

        // 取得當前狀態特徵字串 (State Representation)
        function getStateKey() {
            let hpDiff = ai.hp - player.hp;
            let hpState = hpDiff > 20 ? 'advantage' : (hpDiff < -20 ? 'disadvantage' : 'even');
            let myHpState = ai.hp < 40 ? 'low' : 'high';
            return `${hpState}_${myHpState}`;
        }

        // Q-Learning: 選擇動作 (Epsilon-Greedy)
        function chooseAiAction(state) {
            if (!qTable[state]) {
                qTable[state] = {};
                ACTIONS.forEach(a => qTable[state][a] = 0.0);
            }

            if (Math.random() < EPSILON) {
                return ACTIONS[Math.floor(Math.random() * ACTIONS.length)];
            } else {
                let bestAction = ACTIONS[0];
                let maxQ = -Infinity;
                for (let act of ACTIONS) {
                    if (qTable[state][act] > maxQ) {
                        maxQ = qTable[state][act];
                        bestAction = act;
                    }
                }
                return bestAction;
            }
        }

        // Q-Learning: 更新 Q 值
        function updateQ(state, action, reward, nextState) {
            if (!qTable[state]) qTable[state] = { attack: 0, defend: 0, heal: 0, charge: 0 };
            if (!qTable[nextState]) qTable[nextState] = { attack: 0, defend: 0, heal: 0, charge: 0 };

            let oldQ = qTable[state][action];
            let maxNextQ = Math.max(...Object.values(qTable[nextState]));
            
            // Q-learning 公式更新
            qTable[state][action] = oldQ + ALPHA * (reward + GAMMA * maxNextQ - oldQ);
            localStorage.setItem('beauty_ai_q_table', JSON.stringify(qTable));
            updateUIStats();
        }

        function updateUIStats() {
            let totalStates = Object.keys(qTable).length;
            document.getElementById('qStatesCount').innerText = totalStates;
        }

        function playerMove(actionType) {
            if (gameState !== 'player_turn') return;

            // 玩家行動結算
            let dmgToAi = 0;
            if (actionType === 'attack') {
                dmgToAi = Math.floor(Math.random() * 15) + 15;
                ai.hp = Math.max(0, ai.hp - dmgToAi);
                player.action = 'attack';
            } else if (actionType === 'defend') {
                player.action = 'defend';
                setAiChat("哼，防禦力加高了嗎？但我可不怕！");
            } else if (actionType === 'heal') {
                player.hp = Math.min(player.maxHp, player.hp + 20);
                player.action = 'heal';
            }

            checkGameOver();
            if (gameState === 'game_over') return;

            gameState = 'ai_turn';
            setTimeout(aiTurn, 800);
        }

        function aiTurn() {
            let currentState = getStateKey();
            let action = chooseAiAction(currentState);

            lastStateStr = currentState;
            lastActionStr = action;

            let reward = 0;
            let aiDmg = 0;

            if (action === 'attack') {
                aiDmg = Math.floor(Math.random() * 15) + 12;
                player.hp = Math.max(0, player.hp - aiDmg);
                ai.action = 'attack';
                reward += 10; // 攻擊給予正向獎勵
                setAiChat("接招吧！這是本小姐的連續斬擊！");
            } else if (action === 'defend') {
                ai.action = 'defend';
                reward += 2;
                setAiChat("看穿你的動向了，防禦！");
            } else if (action === 'heal') {
                ai.hp = Math.min(ai.maxHp, ai.hp + 25);
                ai.action = 'heal';
                reward += (ai.hp < 50) ? 15 : 2; // 殘血補血獎勵更高
                setAiChat("微光結晶，修復我的裝甲！");
            } else if (action === 'charge') {
                ai.action = 'charge';
                reward += 5;
                setAiChat("能量聚集中，準備迎接審判吧！");
            }

            document.getElementById('aiActionStr').innerText = `選擇動作: ${action}`;

            let nextState = getStateKey();
            updateQ(currentState, action, reward, nextState);

            checkGameOver();
            if (gameState !== 'game_over') {
                gameState = 'player_turn';
            }
        }

        function manualReward(val) {
            if (!lastStateStr || !lastActionStr) return;
            updateQ(lastStateStr, lastActionStr, val, getStateKey());
            setAiChat(val > 0 ? "謝謝您的肯定！我的神經網路升級了！嗚嗚..." : "哼！竟然懲罰我...我會記取教訓的！");
        }

        function checkGameOver() {
            if (ai.hp <= 0) {
                gameState = 'game_over';
                setAiChat(ai.dialogues.lose);
                updateQ(lastStateStr, lastActionStr, -50, getStateKey()); // 失敗懲罰
            } else if (player.hp <= 0) {
                gameState = 'game_over';
                setAiChat(ai.dialogues.win);
                updateQ(lastStateStr, lastActionStr, 50, getStateKey()); // 勝利獎勵
            }
        }

        function resetMatch() {
            player.hp = 100;
            ai.hp = 100;
            gameState = 'player_turn';
            setAiChat(ai.dialogues.intro);
            document.getElementById('aiActionStr').innerText = '準備中...';
        }

        // 渲染遊戲畫面與美少女動態立繪
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 繪製戰場背景格線
            ctx.strokeStyle = 'rgba(255, 42, 133, 0.1)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }

            // 繪製玩家 (左側藍色光點/角色)
            ctx.fillStyle = '#00f0ff';
            ctx.beginPath();
            ctx.arc(player.x, player.y, 35, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.stroke();

            // 繪製美少女 AI (右側粉色動態角色)
            ctx.fillStyle = '#ff2a85';
            ctx.beginPath();
            ctx.arc(ai.x, ai.y + Math.sin(Date.now() / 300) * 5, 38, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#00f0ff';
            ctx.lineWidth = 3;
            ctx.stroke();

            // 繪製血條
            drawBar(80, 50, 120, 14, player.hp, player.maxHp, '#00f0ff', '玩家');
            drawBar(300, 50, 120, 14, ai.hp, ai.maxHp, '#ff2a85', ai.name);

            requestAnimationFrame(render);
        }

        function drawBar(x, y, w, h, cur, max, color, label) {
            ctx.fillStyle = '#222';
            ctx.fillRect(x, y, w, h);
            ctx.fillStyle = color;
            ctx.fillRect(x, y, (cur / max) * w, h);
            ctx.strokeStyle = '#fff';
            ctx.strokeRect(x, y, w, h);
            ctx.fillStyle = '#fff';
            ctx.font = '11px sans-serif';
            ctx.fillText(`${label}: ${Math.max(0, cur)}/${max}`, x, y - 5);
        }

        // 啟動渲染循環
        updateUIStats();
        render();
    </script>
</body>
</html>
