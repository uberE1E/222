<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>視覺錯覺滾球解謎 (Isometric Puzzle)</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        h1 {
            margin: 4px 0;
            font-size: 22px;
            color: #facc15;
            text-shadow: 0 0 10px rgba(250, 204, 21, 0.4);
        }
        .subtitle {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 12px;
        }
        #canvasWrapper {
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border-radius: 12px;
            overflow: hidden;
            border: 3px solid #334155;
        }
        canvas {
            background-color: #1e1b4b; /* 濃厚科技感背景 */
            display: block;
            cursor: pointer;
        }
        .instructions {
            margin-top: 14px;
            font-size: 12px;
            color: #cbd5e1;
            background: #1e293b;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid #475569;
        }
        kbd {
            background: #334155;
            color: #facc15;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>🟡 視覺錯覺幾何滾球解謎</h1>
    <div class="subtitle">“I made something simple” 幾何解謎短片高仿重現</div>

    <div id="canvasWrapper">
        <canvas id="gameCanvas" width="500" height="500"></canvas>
    </div>

    <div class="instructions">
        💡 操作指示：點擊畫布或按 <kbd>空白鍵 (Space)</kbd> 旋轉黃色錯覺橋樑，讓紅球安全抵達終點！
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let gameState = "PLAYING"; // PLAYING, WIN
        let bridgeAngle = 0; // 0, 90, 180, 270

        // 紅球狀態
        let ball = {
            x: 120,
            y: 380,
            targetIndex: 0,
            speed: 2.2
        };

        // 賽道節點 (等角視角路徑)
        const pathPoints = [
            { x: 120, y: 380 }, // 0: 起點
            { x: 250, y: 300 }, // 1: 轉角一
            { x: 250, y: 200 }, // 2: 橋樑接合處
            { x: 380, y: 120 }, // 3: 終點高塔前
            { x: 380, y: 80 }   // 4: 終點保齡球瓶區
        ];

        function triggerAction() {
            if (gameState === "WIN") {
                resetGame();
                return;
            }
            bridgeAngle = (bridgeAngle + 90) % 360;
        }

        window.addEventListener("keydown", (e) => {
            if (e.key === " " || e.key === "Enter") triggerAction();
        });
        canvas.addEventListener("click", triggerAction);

        function resetGame() {
            gameState = "PLAYING";
            bridgeAngle = 0;
            ball.x = pathPoints[0].x;
            ball.y = pathPoints[0].y;
            ball.targetIndex = 1;
        }

        function update() {
            if (gameState === "WIN") return;

            let target = pathPoints[ball.targetIndex];
            let dx = target.x - ball.x;
            let dy = target.y - ball.y;
            let dist = Math.hypot(dx, dy);

            // 當紅球正要通過橋樑路段 (索引 2)
            if (ball.targetIndex === 3) {
                // 如果此時橋樑角度不是 0 或者是錯開的，球會掉落或卡住
                if (bridgeAngle !== 0) {
                    // 模擬錯覺不通，彈回起點
                    ball.x = pathPoints[0].x;
                    ball.y = pathPoints[0].y;
                    ball.targetIndex = 1;
                    return;
                }
            }

            if (dist < ball.speed) {
                ball.x = target.x;
                ball.y = target.y;
                if (ball.targetIndex < pathPoints.length - 1) {
                    ball.targetIndex++;
                } else {
                    gameState = "WIN";
                }
            } else {
                ball.x += (dx / dist) * ball.speed;
                ball.y += (dy / dist) * ball.speed;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. 繪製底部黃色幾何結構 (Isometric 風格)
            ctx.fillStyle = "#eab308";
            ctx.strokeStyle = "#ca8a04";
            ctx.lineWidth = 3;

            // 主賽道底座
            ctx.beginPath();
            ctx.moveTo(100, 400);
            ctx.lineTo(270, 300);
            ctx.lineTo(270, 220);
            ctx.lineTo(100, 320);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 2. 繪製可旋轉的錯覺橋樑區
            ctx.save();
            ctx.translate(250, 200);
            ctx.rotate((bridgeAngle * Math.PI) / 180);

            ctx.fillStyle = bridgeAngle === 0 ? "#facc15" : "#ca8a04"; // 接通變亮黃色
            ctx.fillRect(-25, -25, 50, 50);
            ctx.strokeRect(-25, -25, 50, 50);

            ctx.restore();

            // 3. 繪製上層終點塔與建築
            ctx.fillStyle = "#eab308";
            ctx.beginPath();
            ctx.moveTo(350, 140);
            ctx.lineTo(410, 100);
            ctx.lineTo(410, 60);
            ctx.lineTo(350, 100);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 4. 終點保齡球瓶
            ctx.fillStyle = gameState === "WIN" ? "#94a3b8" : "#ffffff";
            ctx.beginPath();
            ctx.arc(380, 75 + (gameState === "WIN" ? 10 : 0), 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#ef4444";
            ctx.lineWidth = 2;
            ctx.stroke();

            // 5. 紅色滾球
            ctx.fillStyle = "#ef4444";
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.stroke();

            // 6. 通關提示
            if (gameState === "WIN") {
                ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#facc15";
                ctx.font = "bold 26px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("🎉 撞倒保齡球瓶！完美過關", canvas.width / 2, canvas.height / 2 - 15);

                ctx.fillStyle = "#f8fafc";
                ctx.font = "14px sans-serif";
                ctx.fillText("點擊畫布或按空白鍵再次挑戰", canvas.width / 2, canvas.height / 2 + 25);
                ctx.textAlign = "left";
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
