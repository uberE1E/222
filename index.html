<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Paradox - Hack the System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap');
        
        body {
            font-family: 'Fira Code', monospace;
            background-color: #050505;
            color: #0f0;
            overflow: hidden;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        /* Custom Scrollbar for Terminal */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #001100; 
        }
        ::-webkit-scrollbar-thumb {
            background: #00aa00; 
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00ff00; 
        }

        .crt-effect {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 50;
        }

        #time-btn {
            transition: all 0.1s ease-out;
            cursor: crosshair;
        }

        .glitch-text {
            animation: glitch 1s linear infinite;
        }

        @keyframes glitch {
            2%, 64% { transform: translate(2px, 0) skew(0deg); }
            4%, 60% { transform: translate(-2px, 0) skew(0deg); }
            62% { transform: translate(0, 0) skew(5deg); }
        }

        /* Modal styling to avoid standard alerts */
        #custom-modal {
            backdrop-filter: blur(10px);
            z-index: 100;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col">
    <div class="crt-effect"></div>

    <!-- Login Screen -->
    <div id="login-screen" class="absolute inset-0 flex flex-col items-center justify-center bg-black z-40">
        <h1 class="text-5xl mb-8 glitch-text text-red-500 font-bold">SYSTEM BOOT // TIME PARADOX</h1>
        <p class="mb-8 text-green-400">Authenticating user credentials via Firebase...</p>
        <button id="login-btn" class="px-6 py-3 border-2 border-green-500 text-green-500 hover:bg-green-500 hover:text-black transition-colors font-bold uppercase tracking-widest flex items-center gap-3">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            Initialize Link (Google Login)
        </button>
    </div>

    <!-- Main Game Interface -->
    <div id="game-ui" class="hidden flex-1 grid grid-cols-1 md:grid-cols-2 w-full h-full relative z-10">
        
        <!-- Left Panel: The Trap -->
        <div id="left-panel" class="relative overflow-hidden bg-gray-900 border-r-2 border-green-800 flex items-center justify-center shadow-[inset_0_0_50px_rgba(0,0,0,0.8)]">
            <div class="absolute top-2 left-2 text-xs text-gray-500 opacity-50">AREA: TARGET_ZONE</div>
            
            <button id="time-btn" class="absolute px-6 py-3 bg-red-700 text-white font-bold tracking-widest border border-red-500 shadow-[0_0_15px_#ff0000] rounded-sm transform -translate-x-1/2 -translate-y-1/2" style="top: 50%; left: 50%;">
                時空穿越
            </button>
        </div>

        <!-- Right Panel: Hacking Interface -->
        <div id="right-panel" class="flex flex-col bg-black p-4 h-full">
            <div class="flex justify-between items-center mb-2">
                <span class="text-sm text-green-600">>> NEURAL_LINK_TERMINAL v2.0</span>
                <span class="text-xs text-red-500 animate-pulse">WARNING: ACTIVE AI DEFENSE</span>
            </div>
            
            <textarea id="code-editor" class="flex-1 bg-gray-950 border border-green-800 text-green-400 p-4 font-mono text-sm resize-none focus:outline-none focus:border-green-500" spellcheck="false">
// 系統提示: 目標按鈕 id 為 'time-btn'
// 直接點擊會觸發陷阱並刪除進度
// 撰寫程式碼來駭入或繞過點擊事件，然後提交給AI驗證

const btn = document.getElementById('time-btn');

// Your code here...
</textarea>

            <div class="flex gap-4 mt-4">
                <button id="exec-btn" class="flex-1 border border-cyan-500 text-cyan-500 py-2 hover:bg-cyan-900 transition-colors">
                    > Execute Code Locally
                </button>
                <button id="submit-bug-btn" class="flex-1 border border-purple-500 text-purple-500 py-2 hover:bg-purple-900 transition-colors">
                    > Submit Bug to AI
                </button>
            </div>

            <!-- Terminal Output -->
            <div id="terminal" class="mt-4 h-48 bg-gray-950 border border-green-900 p-2 overflow-y-auto text-xs flex flex-col gap-1">
                <div class="text-green-600">> System Initialized. Awaiting input.</div>
            </div>
        </div>
    </div>

    <!-- Custom Modal -->
    <div id="custom-modal" class="hidden fixed inset-0 flex items-center justify-center bg-black bg-opacity-80">
        <div class="bg-gray-900 border-4 border-green-500 p-8 max-w-lg w-full text-center shadow-[0_0_30px_rgba(0,255,0,0.3)]">
            <h2 id="modal-title" class="text-3xl font-bold mb-4">Notification</h2>
            <p id="modal-msg" class="mb-6 whitespace-pre-wrap text-lg"></p>
            <button id="modal-close" class="px-6 py-2 bg-green-900 text-white font-bold hover:bg-green-700 border border-green-400">ACKNOWLEDGE</button>
        </div>
    </div>

    <script type="module">
        // Firebase Imports
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Setup
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'time-paradox-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        let initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        
        let app, db, auth, userId;
        let cheatActive = false;
        let aiDefenseInterval = null;
        
        // DOM Elements
        const loginScreen = document.getElementById('login-screen');
        const gameUI = document.getElementById('game-ui');
        const loginBtn = document.getElementById('login-btn');
        const leftPanel = document.getElementById('left-panel');
        const timeBtn = document.getElementById('time-btn');
        const terminal = document.getElementById('terminal');
        const codeEditor = document.getElementById('code-editor');
        const execBtn = document.getElementById('exec-btn');
        const submitBugBtn = document.getElementById('submit-bug-btn');
        
        const modal = document.getElementById('custom-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMsg = document.getElementById('modal-msg');
        const modalClose = document.getElementById('modal-close');

        // Gemini API Config
        const geminiApiKey = ""; // Required to be empty for platform injection
        const geminiApiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${geminiApiKey}`;

        // Utility: Show Modal
        function showModal(title, msg, type = 'info') {
            modalTitle.innerText = title;
            modalMsg.innerText = msg;
            
            if(type === 'error') {
                modal.querySelector('div').className = "bg-gray-900 border-4 border-red-500 p-8 max-w-lg w-full text-center shadow-[0_0_40px_rgba(255,0,0,0.5)]";
                modalTitle.className = "text-3xl font-bold mb-4 text-red-500";
            } else if (type === 'success') {
                modal.querySelector('div').className = "bg-gray-900 border-4 border-green-500 p-8 max-w-lg w-full text-center shadow-[0_0_40px_rgba(0,255,0,0.5)]";
                modalTitle.className = "text-3xl font-bold mb-4 text-green-500";
            } else {
                modal.querySelector('div').className = "bg-gray-900 border-4 border-blue-500 p-8 max-w-lg w-full text-center shadow-[0_0_40px_rgba(0,0,255,0.5)]";
                modalTitle.className = "text-3xl font-bold mb-4 text-blue-500";
            }
            
            modal.classList.remove('hidden');
        }

        modalClose.onclick = () => modal.classList.add('hidden');

        // Utility: Log to Terminal
        function log(msg, type = 'info') {
            const p = document.createElement('div');
            const time = new Date().toLocaleTimeString();
            p.innerText = `[${time}] ${msg}`;
            if (type === 'error') p.classList.add('text-red-500');
            else if (type === 'warning') p.classList.add('text-yellow-500');
            else if (type === 'success') p.classList.add('text-cyan-400');
            else p.classList.add('text-green-500');
            
            terminal.appendChild(p);
            terminal.scrollTop = terminal.scrollHeight;
        }

        // Initialize Firebase & Game
        async function initGame() {
            try {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                
                log("Authenticating...", "warning");
                
                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    try {
                        const provider = new GoogleAuthProvider();
                        await signInWithPopup(auth, provider);
                    } catch (e) {
                        log("Google Popup blocked or failed. Falling back to anonymous login.", "warning");
                        await signInAnonymously(auth);
                    }
                }
                
                userId = auth.currentUser.uid;
                log(`Auth successful. UserID: ${userId.substring(0,8)}...`, "success");
                
                // Save/Load Progress
                const progressRef = doc(db, 'artifacts', appId, 'users', userId);
                const docSnap = await getDoc(progressRef);
                if (!docSnap.exists()) {
                    await setDoc(progressRef, { attempts: 0, level: 1, lastLogin: new Date().toISOString() });
                    log("Created new progress profile.");
                } else {
                    log("Loaded existing progress profile.");
                }

                // Show Game
                loginScreen.classList.add('hidden');
                gameUI.classList.remove('hidden');
                
                startGameMechanics();
            } catch (err) {
                console.error(err);
                alert("Critical System Failure: Cannot connect to backend.");
            }
        }

        loginBtn.onclick = () => {
            loginBtn.innerText = "CONNECTING...";
            loginBtn.disabled = true;
            initGame();
        };

        // Core Game Mechanics: The Evasive Button
        function startGameMechanics() {
            leftPanel.addEventListener('mousemove', (e) => {
                if (cheatActive) return;
                
                const rect = timeBtn.getBoundingClientRect();
                const btnX = rect.left + rect.width / 2;
                const btnY = rect.top + rect.height / 2;
                
                // Calculate distance
                const dist = Math.hypot(e.clientX - btnX, e.clientY - btnY);
                
                // Extreme evasive maneuvers - 100% impossible
                if (dist < 450) {
                    // Evasion move
                    const maxW = leftPanel.clientWidth - rect.width;
                    const maxH = leftPanel.clientHeight - rect.height;
                    const newX = Math.random() * maxW;
                    const newY = Math.random() * maxH;
                    
                    timeBtn.style.left = `${newX}px`;
                    timeBtn.style.top = `${newY}px`;
                    timeBtn.style.transform = `scale(${0.2 + Math.random() * 0.6}) rotate(${Math.random() * 360}deg)`;
                }
            });

            // The TRAP
            timeBtn.onclick = async (e) => {
                if (cheatActive) {
                    showModal("OVERRIDE SUCCESS", "進入破解版模式，安全穿越！\n資料庫存取已繞過。", "success");
                    return;
                }

                // Execute malicious trap
                try {
                    const progressRef = doc(db, 'artifacts', appId, 'users', userId);
                    await deleteDoc(progressRef);
                    showModal("FATAL ERROR", "進度已刪除！時空穿越失敗。\n網頁防護機制已觸發，即將關閉連接...", "error");
                    
                    setTimeout(() => {
                        window.close();
                        // Fallback if window.close is blocked
                        document.body.innerHTML = '<div style="color:red; font-size: 5rem; text-align:center; margin-top:20vh; font-family: monospace;">CONNECTION TERMINATED.<br>YOUR DATA IS GONE.</div>';
                    }, 4000);
                } catch (err) {
                    log("Trap executed, but failed to reach DB.", "error");
                }
            };

            // Start AI Opponent Loop
            aiDefenseInterval = setInterval(updateAIDefense, 45000);
            log("Game loops initialized. AI defense active.", "info");
        }

        // Code Execution Handler
        execBtn.onclick = () => {
            const code = codeEditor.value;
            try {
                log("Executing local script...");
                // Create a localized scope to execute the code safely
                const execFunc = new Function('timeBtn', 'log', code);
                execFunc(timeBtn, log);
                log("Script executed successfully.", "success");
            } catch (err) {
                log(`Execution Error: ${err.message}`, "error");
            }
        };

        // Submit to AI Handler
        submitBugBtn.onclick = async () => {
            const code = codeEditor.value;
            if (!code.trim()) {
                log("Error: Empty code block.", "error");
                return;
            }

            log("Uplinking code to AI Core for validation...", "warning");
            submitBugBtn.disabled = true;
            submitBugBtn.innerText = "Analyzing...";

            const systemPrompt = `You are evaluating a player's JS code for a hacking puzzle game. The player needs to click a button with id 'time-btn' OR bypass its onclick deletion trap so their account data is kept safe. Analyze their submitted code. If it successfully overrides the onclick, removes the event listener, safely clicks it programmatically after disarming, or generally achieves the goal of interacting with the button without triggering a data deletion script, reply with ONLY 'SUCCESS: <explanation of how they won>'. Otherwise, reply 'FAIL: <reason why it doesn't work or still triggers the trap>'. DO NOT use markdown code blocks in your response.`;

            const payload = {
                contents: [{ parts: [{ text: code }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] }
            };

            try {
                const response = await fetch(geminiApiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                const reply = result.candidates?.[0]?.content?.parts?.[0]?.text || "FAIL: AI Core unresponsive.";
                
                if (reply.trim().startsWith("SUCCESS")) {
                    clearInterval(aiDefenseInterval);
                    showModal("通關成功！", "進度已保留並完成時空穿越！\n\n[AI 判定]:\n" + reply, "success");
                    log("SYSTEM COMPROMISED. PLAYER WINS.", "success");
                } else {
                    log(`AI VERDICT: ${reply}`, "error");
                    showModal("HACK FAILED", reply, "error");
                }
            } catch (err) {
                log(`Uplink failed: ${err.message}`, "error");
            } finally {
                submitBugBtn.disabled = false;
                submitBugBtn.innerText = "> Submit Bug to AI";
            }
        };

        // Dynamic AI Opponent Logic
        async function updateAIDefense() {
            if (cheatActive) return;
            log("Warning: Enemy AI is generating new defense countermeasures...", "warning");

            const aiPrompt = `You are an adversarial AI in a hacking game. Your job is to output EXACTLY 1 to 3 lines of JavaScript code to make the HTML element with id 'time-btn' significantly harder to click or find. You can modify its CSS styles (opacity, transform, animation, z-index, filters). Assume 'document.getElementById("time-btn")' is used to get the button. Do NOT remove or delete the button. Do NOT use backticks, quotes, or markdown block formatting. Output ONLY raw executable JavaScript code.`;

            const payload = {
                contents: [{ parts: [{ text: aiPrompt }] }]
            };

            try {
                const response = await fetch(geminiApiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                let newCode = result.candidates?.[0]?.content?.parts?.[0]?.text || "";
                
                // Clean up AI output just in case it wraps it in markdown
                newCode = newCode.replace(/```javascript/gi, '').replace(/```/g, '').trim();
                
                if (newCode) {
                    const aiFunc = new Function(newCode);
                    aiFunc();
                    log("Enemy AI Defense Protocol Updated!", "error");
                }
            } catch (err) {
                log(`AI Defense Update dropped: ${err.message}`);
            }
        }

        // Cheat Code Keylogger
        let keyBuffer = '';
        window.addEventListener('keydown', (e) => {
            keyBuffer += e.key;
            if (keyBuffer.length > 10) keyBuffer = keyBuffer.slice(-10);
            
            if (keyBuffer.includes('uber-1')) {
                activateCheat();
                keyBuffer = '';
            }
        });

        function activateCheat() {
            if (cheatActive) return;
            cheatActive = true;
            clearInterval(aiDefenseInterval);
            
            // Revert button to safe state
            timeBtn.style.transition = 'all 1s ease';
            timeBtn.style.transform = 'translate(-50%, -50%) scale(1.5)';
            timeBtn.style.left = '50%';
            timeBtn.style.top = '50%';
            timeBtn.style.backgroundColor = '#00ff00';
            timeBtn.style.boxShadow = '0 0 40px #00ff00';
            timeBtn.style.color = '#000';
            timeBtn.style.border = 'none';
            timeBtn.style.pointerEvents = 'auto';
            timeBtn.style.filter = 'none';
            timeBtn.style.opacity = '1';
            timeBtn.innerText = '安全穿越 (CRACKED)';
            
            log("=========================================", "success");
            log(" ROOT OVERRIDE ACCEPTED.", "success");
            log(" CHEAT CODE 'uber-1' ACTIVATED.", "success");
            log(" EVASION LOGIC DISABLED. TRAP DISARMED.", "success");
            log("=========================================", "success");
            
            showModal("SYSTEM CRACKED", "進入破解版模式\n所有防護機制已停用。", "success");
        }

    </script>
</body>
</html>
