<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>“I made something simple” - 瘋狂連鎖保齡球</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        h1 {
            margin: 4px 0;
            font-size: 22px;
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }
        .subtitle {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 10px;
        }
        #canvasWrapper {
            position: relative;
            box-shadow: 0 12px 30px rgba(0,0,0,0.8);
            border-radius: 12px;
            overflow: hidden;
            border: 3px solid #334155;
        }
        canvas {
            background-color: #1e1b4b;
            display: block;
        }
        .instructions {
            margin-top: 12px;
            font-size: 12px;
            color: #cbd5e1;
            background: #1e293b;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid #475569;
        }
        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 8px;
        }
        button:hover { background: #0369a1; }
    </style>
</head>
<body>

    <h1>🧑‍💻 “I made something simple” (我做了個簡單的小東西)</h1>
    <div class="subtitle">獨立開發者口中「很簡單」的物理連鎖保齡球模擬器</div>

    <div id="canvasWrapper">
        <canvas id="gameCanvas" width="600" height="500"></canvas>
    </div>

    <div class="instructions">
        👉 點擊按鈕或畫面來<strong>發射小球</strong>，體驗那種「簡單」卻華麗到爆炸的連鎖反應！
        <button onclick="resetSimulation()">重新發射</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // 模擬狀態
        let ball = { x: 50, y: 80, vx: 0, vy: 0, radius: 10, active: false };
        let stage = 0; // 0: 待命, 1: 下坡加速, 2: 旋轉齒輪區, 3: 彈跳板, 4: 撞擊保齡球
        let gearAngle = 0;
        let pins = [];
        let hitPinsCount = 0;
        let message = "點擊畫面發射小球";

        function initPins() {
            pins = [];
            let startX = 480, startY = 380;
            // 經典保齡球三角陣型
            let rows = 4;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c <= r; c++) {
                    pins.push({
                        x: startX + r * 22,
                        y: startY + (c - r / 2) * 24,
                        vx: 0, vy: 0,
                        radius: 7,
                        hit: false
                    });
                }
            }
            hitPinsCount = 0;
        }

        initPins();

        function launchBall() {
            ball.x = 50;
            ball.y = 80;
            ball.vx = 4.5;
            ball.vy = 0;
            ball.active = true;
            stage = 1;
            message = "小球出發！看似簡單...";
            initPins();
        }

        window.addEventListener("click", (e) => {
            // 避免點到按鈕重複觸發
            if (e.target.tagName === 'BUTTON') return;
            if (!ball.active) launchBall();
        });

        function update() {
            gearAngle += 0.05;

            if (!ball.active) return;

            // 物理運動與機關連鎖
            ball.vy += 0.25; // 重力
            ball.x += ball.vx;
            ball.y += ball.vy;

            // 1. 第一段斜坡
            if (stage === 1 && ball.x > 180 && ball.y > 180) {
                stage = 2;
                message = "進入旋轉齒輪與錯覺加速區！";
            }

            // 2. 第二段旋轉齒輪區
            if (stage === 2 && ball.x > 320) {
                stage = 3;
                ball.vy = -7.5; // 彈跳板往上彈
                ball.vx = 6;
                message = "彈跳板啟動！重力反轉！";
            }

            // 3. 軌道邊界反彈與引導
            // 地板防護
            if (ball.y > 450 && ball.x < 450) {
                ball.y = 450;
                ball.vy = -ball.vy * 0.4;
            }
            // 天花板
            if (ball.y < 40) {
                ball.y = 40;
                ball.vy = 2;
            }

            // 4. 撞擊保齡球區
            if (ball.x > 440 && stage < 4) {
                stage = 4;
                message = "STRIKE！連鎖反應大爆炸！";
            }

            // 保齡球物理碰撞
            pins.forEach(pin => {
                let dist = Math.hypot(ball.x - pin.x, ball.y - pin.y);
                if (dist < ball.radius + pin.radius) {
                    pin.hit = true;
                    let angle = Math.atan2(pin.y - ball.y, pin.x - ball.x);
                    pin.vx = Math.cos(angle) * 7;
                    pin.vy = Math.sin(angle) * 7;
                }

                if (pin.hit) {
                    pin.x += pin.vx;
                    pin.y += pin.vy;
                    pin.vx *= 0.92;
                    pin.vy *= 0.92;
                }
            });

            // 計算倒下的瓶子數
            hitPinsCount = pins.filter(p => p.hit).length;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 繪製極簡賽道與裝飾線條 (呼應影片中的極簡風格)
            ctx.strokeStyle = "#475569";
            ctx.lineWidth = 3;

            // 起始滑軌
            ctx.beginPath();
            ctx.moveTo(30, 90);
            ctx.lineTo(200, 220);
            ctx.stroke();

            // 中間迴旋軌道
            ctx.strokeStyle = "#38bdf8";
            ctx.beginPath();
            ctx.arc(260, 220, 60, Math.PI, 0, false);
            ctx.stroke();

            // 旋轉齒輪視覺
            ctx.save();
            ctx.translate(260, 220);
            ctx.rotate(gearAngle);
            ctx.strokeStyle = "#f43f5e";
            ctx.lineWidth = 2;
            ctx.strokeRect(-15, -15, 30, 30);
            ctx.restore();

            // 彈跳板
            ctx.fillStyle = "#eab308";
            ctx.fillRect(340, 260, 60, 10);

            // 終點保齡球底座
            ctx.fillStyle = "#334155";
            ctx.fillRect(460, 330, 110, 120);

            // 繪製保齡球瓶
            pins.forEach(pin => {
                ctx.fillStyle = pin.hit ? "#94a3b8" : "#ffffff";
                ctx.beginPath();
                ctx.arc(pin.x, pin.y, pin.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "#ef4444";
                ctx.lineWidth = 1.5;
                ctx.stroke();
            });

            // 繪製主角小球
            if (ball.active) {
                ctx.fillStyle = "#ef4444";
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 2;
                ctx.stroke();
            } else {
                // 待命提示球
                ctx.fillStyle = "#ef4444";
                ctx.beginPath();
                ctx.arc(50, 80, ball.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // 狀態與訊息文字
            ctx.fillStyle = "#f8fafc";
            ctx.font = "bold 14px sans-serif";
            ctx.fillText(`狀態: ${message}`, 20, 35);
            ctx.fillText(`倒塌瓶數: ${hitPinsCount} / ${pins.length}`, 20, 55);

            if (!ball.active) {
                ctx.fillStyle = "rgba(15, 23, 42, 0.6)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#38bdf8";
                ctx.font = "bold 24px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("點擊任意處發射「簡單」小球", canvas.width / 2, canvas.height / 2);
                ctx.textAlign = "left";
            }
        }

        function resetSimulation() {
            ball.active = false;
            stage = 0;
            message = "等待發射...";
            initPins();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
