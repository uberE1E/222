<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極簡視覺錯覺滾球解謎 (Monument Ball)</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background-color: #f1f5f9;
            color: #1e293b;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        h1 {
            margin: 4px 0;
            font-size: 22px;
            color: #d97706;
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .subtitle {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 12px;
        }
        #gameWrapper {
            position: relative;
            box-shadow: 0 12px 30px rgba(0,0,0,0.15);
            border-radius: 12px;
            overflow: hidden;
        }
        canvas {
            background-color: #fef08a; /* 影片經典黃色底色 */
            display: block;
            cursor: pointer;
        }
        .instructions {
            margin-top: 14px;
            font-size: 12px;
            color: #475569;
            background: #ffffff;
            padding: 8px 16px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        kbd {
            background: #e2e8f0;
            color: #0f172a;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>🟡 視覺錯覺幾何滾球解謎</h1>
    <div class="subtitle">致敬《When the indie game dev says "I made something simple"》極簡迷宮設計</div>

    <div id="gameWrapper">
        <canvas id="gameCanvas" width="500" height="600"></canvas>
    </div>

    <div class="instructions">
        💡 操作指示：點擊畫布或按 <kbd>空白鍵 (Space)</kbd> 旋轉錯覺橋樑，連接賽道引導紅球抵達終點！
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // 遊戲狀態
        let gameState = "PLAYING"; // PLAYING, WIN
        let bridgeAngle = 0; // 0 或 90 度
        let ball = {
            segment: 0,
            t: 0, // 0 到 1 之間的路徑插值
            speed: 0.006,
            x: 0,
            y: 0
        };

        // 靜態賽道關鍵節點 (Isometric 座標風格)
        const waypoints = [
            { x: 100, y: 480 }, // 0: 起點 (右下)
            { x: 250, y: 400 }, // 1: 底部轉角
            { x: 250, y: 300 }, // 2: 橋樑入口
            // 橋樑接合處 (動態)
            { x: 250, y: 180 }, // 3: 橋樑出口
            { x: 250, y: 120 }, // 4: 頂部保齡球瓶區 (終點)
        ];

        // 保齡球瓶
        let pins = [
            { x: 240, y: 110, hit: false },
            { x: 250, y: 105, hit: false },
            { x: 260, y: 110, hit: false }
        ];

        // 點擊旋轉機關
        function triggerMechanism() {
            if (gameState === "WIN") {
                resetGame();
                return;
            }
            bridgeAngle = (bridgeAngle + 90) % 180;
        }

        window.addEventListener("keydown", (e) => {
            if (e.key === " " || e.key === "Enter") triggerMechanism();
        });
        canvas.addEventListener("click", triggerMechanism);

        function resetGame() {
            gameState = "PLAYING";
            bridgeAngle = 0;
            ball.segment = 0;
            ball.t = 0;
            pins.forEach(p => p.hit = false);
        }

        function update() {
            if (gameState === "WIN") return;

            // 紅球前進邏輯
            ball.t += ball.speed;

            if (ball.t >= 1) {
                ball.t = 0;
                ball.segment++;

                // 檢查橋樑是否正確連接 (當球到達第 2 段轉 3 段時)
                if (ball.segment === 2) {
                    // 如果橋樑角度為 0 (接通狀態)，繼續通過；否則掉落重來
                    if (bridgeAngle !== 0) {
                        ball.segment = 0; // 錯覺斷開，回到起點
                        ball.t = 0;
                    }
                }

                // 到達終點撞倒球瓶
                if (ball.segment >= 3) {
                    gameState = "WIN";
                    pins.forEach(p => p.hit = true);
                }
            }

            // 計算目前紅球座標
            let p1 = waypoints[Math.min(ball.segment, waypoints.length - 1)];
            let p2 = waypoints[Math.min(ball.segment + 1, waypoints.length - 1)];

            ball.x = p1.x + (p2.x - p1.x) * ball.t;
            ball.y = p1.y + (p2.y - p1.y) * ball.t;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. 繪製極簡背景柱與賽道 (影片經典黃色建築)
            ctx.fillStyle = "#eab308"; // 主黃色
            ctx.strokeStyle = "#ca8a04";
            ctx.lineWidth = 4;

            // 底部賽道
            ctx.beginPath();
            ctx.moveTo(80, 500);
            ctx.lineTo(270, 410);
            ctx.lineTo(270, 290);
            ctx.lineTo(230, 290);
            ctx.lineTo(230, 390);
            ctx.lineTo(80, 460);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 頂部賽道與終點塔
            ctx.beginPath();
            ctx.moveTo(230, 190);
            ctx.lineTo(270, 190);
            ctx.lineTo(270, 90);
            ctx.lineTo(230, 90);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 2. 繪製錯覺旋轉橋樑 (藍色獨立組件)
            ctx.save();
            ctx.translate(250, 240);
            ctx.rotate((bridgeAngle * Math.PI) / 180);

            ctx.fillStyle = "#0284c7"; // 藍色機關
            ctx.strokeStyle = "#0369a1";
            ctx.lineWidth = 3;

            ctx.fillRect(-20, -40, 40, 80);
            ctx.strokeRect(-20, -40, 40, 80);

            ctx.restore();

            // 3. 繪製保齡球瓶
            pins.forEach(p => {
                ctx.fillStyle = p.hit ? "#94a3b8" : "#ffffff";
                ctx.beginPath();
                ctx.arc(p.x, p.y + (p.hit ? 10 : 0), 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "#ef4444";
                ctx.lineWidth = 2;
                ctx.stroke();
            });

            // 4. 繪製紅色彈跳小球
            ctx.fillStyle = "#ef4444"; // 影片經典紅球
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, 11, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.stroke();

            // 5. 破關 Victory 提示
            if (gameState === "WIN") {
                ctx.fillStyle = "rgba(15, 23, 42, 0.75)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#fef08a";
                ctx.font = "bold 28px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("🎉 完美通關！", canvas.width / 2, canvas.height / 2 - 10);

                ctx.fillStyle = "#ffffff";
                ctx.font = "14px sans-serif";
                ctx.fillText("點擊或按空白鍵重新挑戰", canvas.width / 2, canvas.height / 2 + 30);
                ctx.textAlign = "left";
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
