<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>方塊法師：元素防禦戰</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        h1 {
            margin: 4px 0;
            font-size: 22px;
            color: #c084fc;
            text-shadow: 0 0 10px rgba(192, 132, 252, 0.5);
        }
        .subtitle {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 8px;
        }
        canvas {
            border: 3px solid #334155;
            background-color: #1e1b4b;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-radius: 8px;
            cursor: pointer;
        }
        .ui-panel {
            margin-top: 8px;
            display: flex;
            gap: 15px;
            font-size: 13px;
            font-weight: bold;
        }
        .ui-badge {
            background: #312e81;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid #4338ca;
        }
        .instructions {
            margin-top: 6px;
            font-size: 11px;
            color: #94a3b8;
            background: #1e293b;
            padding: 6px 12px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h1>🔮 方塊法師：元素防禦戰</h1>
    <div class="subtitle">點擊畫布放置法術防禦塔，阻擋邪惡像素怪獸的進攻！</div>

    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <div class="ui-panel">
        <div class="ui-badge">💰 金幣: <span id="goldVal">150</span></div>
        <div class="ui-badge">❤️ 生命值: <span id="hpVal">20</span></div>
        <div class="ui-badge">🌊 波次: <span id="waveVal">1</span></div>
    </div>

    <div class="instructions">
        提示：點擊地圖空白處花費 50 金幣建造魔法塔。塔會自動攻擊射程內的怪獸！
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let gold = 150;
        let hp = 20;
        let wave = 1;
        let gameOver = false;

        // 敵人路徑 (S型路徑)
        const path = [
            {x: 0, y: 80},
            {x: 150, y: 80},
            {x: 150, y: 280},
            {x: 350, y: 280},
            {x: 350, y: 120},
            {x: 500, y: 120},
            {x: 500, y: 350},
            {x: 600, y: 350}
        ];

        let towers = [];
        let enemies = [];
        let projectiles = [];

        let spawnTimer = 0;
        let enemiesToSpawn = 5;

        // 放置防禦塔
        canvas.addEventListener("click", (e) => {
            if (gameOver) {
                resetGame();
                return;
            }

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // 檢查是否點在路上 (簡單避開路徑)
            if (gold >= 50) {
                towers.push({ x: x, y: y, range: 90, damage: 25, coolDown: 0, maxCoolDown: 35 });
                gold -= 50;
                document.getElementById("goldVal").innerText = gold;
            }
        });

        function spawnEnemy() {
            if (enemiesToSpawn > 0) {
                enemies.push({
                    pathIndex: 0,
                    x: path[0].x,
                    y: path[0].y,
                    hp: 60 + wave * 15,
                    maxHp: 60 + wave * 15,
                    speed: 1.5 + wave * 0.1,
                    size: 14
                });
                enemiesToSpawn--;
            } else if (enemies.length === 0) {
                // 下一波
                wave++;
                document.getElementById("waveVal").innerText = wave;
                enemiesToSpawn = 5 + wave * 2;
            }
        }

        function update() {
            if (gameOver) return;

            spawnTimer++;
            if (spawnTimer > 50) {
                spawnEnemy();
                spawnTimer = 0;
            }

            // 更新敵人位置
            for (let i = enemies.length - 1; i >= 0; i--) {
                let en = enemies[i];
                let target = path[en.pathIndex + 1];
                if (!target) {
                    // 到達終點扣血
                    hp--;
                    document.getElementById("hpVal").innerText = hp;
                    enemies.splice(i, 1);
                    if (hp <= 0) gameOver = true;
                    continue;
                }

                let dx = target.x - en.x;
                let dy = target.y - en.y;
                let dist = Math.hypot(dx, dy);

                if (dist < en.speed) {
                    en.x = target.x;
                    en.y = target.y;
                    en.pathIndex++;
                } else {
                    en.x += (dx / dist) * en.speed;
                    en.y += (dy / dist) * en.speed;
                }
            }

            // 更新防禦塔攻擊
            for (let t of towers) {
                if (t.coolDown > 0) t.coolDown--;

                if (t.coolDown === 0) {
                    // 尋找射程內最近的敵人
                    let closestEnemy = null;
                    let minDist = Infinity;

                    for (let en of enemies) {
                        let d = Math.hypot(en.x - t.x, en.y - t.y);
                        if (d < t.range && d < minDist) {
                            minDist = d;
                            closestEnemy = en;
                        }
                    }

                    if (closestEnemy) {
                        projectiles.push({
                            x: t.x,
                            y: t.y,
                            target: closestEnemy,
                            speed: 6,
                            damage: t.damage
                        });
                        t.coolDown = t.maxCoolDown;
                    }
                }
            }

            // 更新飛彈
            for (let i = projectiles.length - 1; i >= 0; i--) {
                let p = projectiles[i];
                if (!p.target || p.target.hp <= 0) {
                    projectiles.splice(i, 1);
                    continue;
                }

                let dx = p.target.x - p.x;
                let dy = p.target.y - p.y;
                let dist = Math.hypot(dx, dy);

                if (dist < p.speed) {
                    // 擊中
                    p.target.hp -= p.damage;
                    if (p.target.hp <= 0) {
                        let idx = enemies.indexOf(p.target);
                        if (idx !== -1) enemies.splice(idx, 1);
                        gold += 20; // 擊殺獎勵金幣
                        document.getElementById("goldVal").innerText = gold;
                    }
                    projectiles.splice(i, 1);
                } else {
                    p.x += (dx / dist) * p.speed;
                    p.y += (dy / dist) * p.speed;
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. 繪製地圖路徑
            ctx.strokeStyle = "#312e81";
            ctx.lineWidth = 28;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            ctx.beginPath();
            ctx.moveTo(path[0].x, path[0].y);
            for (let i = 1; i < path.length; i++) {
                ctx.lineTo(path[i].x, path[i].y);
            }
            ctx.stroke();

            // 2. 繪製防禦塔
            for (let t of towers) {
                ctx.fillStyle = "#c084fc";
                ctx.fillRect(t.x - 12, t.y - 12, 24, 24);
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 2;
                ctx.strokeRect(t.x - 12, t.y - 12, 24, 24);
            }

            // 3. 繪製敵人
            for (let en of enemies) {
                ctx.fillStyle = "#f43f5e";
                ctx.beginPath();
                ctx.arc(en.x, en.y, en.size, 0, Math.PI * 2);
                ctx.fill();

                // 血條
                ctx.fillStyle = "#334155";
                ctx.fillRect(en.x - 15, en.y - 22, 30, 4);
                ctx.fillStyle = "#10b981";
                ctx.fillRect(en.x - 15, en.y - 22, 30 * (en.hp / en.maxHp), 4);
            }

            // 4. 繪製飛彈
            for (let p of projectiles) {
                ctx.fillStyle = "#38bdf8";
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fill();
            }

            // 遊戲結束畫面
            if (gameOver) {
                ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#f43f5e";
                ctx.font = "bold 26px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("防線崩潰 (GAME OVER)", canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = "#f8fafc";
                ctx.font = "14px sans-serif";
                ctx.fillText(`撐過了 ${wave} 波進攻`, canvas.width / 2, canvas.height / 2 + 15);
                ctx.fillStyle = "#38bdf8";
                ctx.fillText("點擊任意處重新開始", canvas.width / 2, canvas.height / 2 + 50);
                ctx.textAlign = "left";
            }
        }

        function resetGame() {
            gold = 150;
            hp = 20;
            wave = 1;
            gameOver = false;
            towers = [];
            enemies = [];
            projectiles = [];
            enemiesToSpawn = 5;
            document.getElementById("goldVal").innerText = gold;
            document.getElementById("hpVal").innerText = hp;
            document.getElementById("waveVal").innerText = wave;
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
