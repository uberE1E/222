<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極速 Q-Learning AI 雙頻背景演化競賽模擬器 (5000輛)</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background-color: #111;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
            padding: 10px 0;
        }
        h1 {
            margin: 4px 0;
            font-size: 20px;
            color: #f1c40f;
            text-shadow: 0 0 10px rgba(241, 196, 15, 0.4);
        }
        #mainContainer {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }
        #leftPanel {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        #canvasWrapper {
            position: relative;
        }
        canvas {
            border: 3px solid #333;
            background-color: #1a1a1a;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8);
            border-radius: 8px;
            cursor: crosshair;
        }
        /* 新增結果圖表區 */
        #chartBox {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #chartBox h3 {
            margin: 0 0 4px 0;
            font-size: 12px;
            color: #3498db;
        }
        #statsCanvas {
            background: #151515;
            border-radius: 4px;
        }
        #controlPanel {
            width: 310px;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            max-height: 720px;
            overflow-y: auto;
        }
        .panel-section {
            background: #252525;
            padding: 8px 10px;
            border-radius: 6px;
            border-left: 4px solid #3498db;
        }
        .panel-section.edit-mode { border-left-color: #e67e22; }
        .panel-section.sim-mode { border-left-color: #2ecc71; }
        .panel-section.reward-mode { border-left-color: #9b59b6; }
        .panel-section h3 {
            margin: 0 0 6px 0;
            font-size: 13px;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            margin-bottom: 3px;
            color: #bbb;
        }
        .stat-val { font-weight: bold; color: #2ecc71; }
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            margin-top: 4px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover { background-color: #2980b9; transform: translateY(-1px); }
        button.active { background-color: #e67e22 !important; box-shadow: 0 0 8px rgba(230, 126, 34, 0.6); }
        button.secondary { background-color: #4a4a4a; }
        button.secondary:hover { background-color: #5a5a5a; }
        button.danger { background-color: #e74c3c; }
        button.danger:hover { background-color: #c0392b; }
        button.success { background-color: #2ecc71; }
        button.success:hover { background-color: #27ae60; }
        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
            font-size: 11px;
            margin-top: 4px;
            color: #aaa;
        }
        input[type="range"] { width: 100%; accent-color: #3498db; }
        .instructions {
            font-size: 10px;
            color: #888;
            line-height: 1.3;
            background: #181818;
            padding: 6px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h1>🏎️ 極速 Q-Learning AI 雙頻背景演化模擬器</h1>

    <div id="mainContainer">
        <div id="leftPanel">
            <div id="canvasWrapper">
                <canvas id="simCanvas" width="850" height="460"></canvas>
            </div>
            <!-- 新增每輪結果折線圖區 -->
            <div id="chartBox">
                <h3>📈 每輪演化表現折線圖 (得分與勝場)</h3>
                <canvas id="statsCanvas" width="850" height="130"></canvas>
            </div>
        </div>

        <div id="controlPanel">
            <!-- 雙模擬器與演化控制 -->
            <div class="panel-section sim-mode">
                <h3>⚡ 雙模擬器與演化控制</h3>
                <div class="stat-row">
                    <span>運作模式:</span>
                    <button id="simToggleBtn" class="success" style="width: auto; padding: 2px 8px;" onclick="toggleDualSimMode()">雙模擬器 (背景加速)</button>
                </div>
                <div class="stat-row">
                    <span>演化狀態:</span>
                    <button id="pauseBtn" class="secondary" style="width: auto; padding: 2px 8px;" onclick="togglePause()">暫停演化</button>
                </div>
            </div>

            <!-- 賽道編輯工具 -->
            <div class="panel-section edit-mode">
                <h3>🛠️ 賽道編輯工具</h3>
                <div class="btn-group">
                    <button id="toolWallBtn" class="active" onclick="setEditTool('wall')">🧱 繪製牆壁</button>
                    <button id="toolStartBtn" onclick="setEditTool('start')">🚩 設定起點</button>
                    <button id="toolFinishBtn" onclick="setEditTool('finish')">🏁 設定終點</button>
                    <button id="toolEraseBtn" onclick="setEditTool('erase')">🧹 橡皮擦</button>
                </div>
                <div class="btn-group" style="margin-top: 4px;">
                    <button class="secondary" onclick="clearTrack()">清空賽道</button>
                    <button class="secondary" onclick="loadPresetTrack()">載入極限彎道</button>
                </div>
            </div>

            <!-- 獎勵與分數調整區 (新增) -->
            <div class="panel-section reward-mode">
                <h3>🎯 得分獎懲與路徑調整</h3>
                <div class="slider-group">
                    <label>到達終點獎勵: <span id="rewWinTxt" class="stat-val">500</span></label>
                    <input type="range" id="rewWinRange" min="100" max="1000" step="50" value="500">
                </div>
                <div class="slider-group">
                    <label>撞擊牆壁懲罰: <span id="rewCrashTxt" class="stat-val">-150</span></label>
                    <input type="range" id="rewCrashRange" min="-500" max="-50" step="25" value="-150">
                </div>
                <div class="slider-group">
                    <label>路徑長度加權: <span id="rewDistTxt" class="stat-val">1.0</span></label>
                    <input type="range" id="rewDistRange" min="0.1" max="3.0" step="0.1" value="1.0">
                </div>
                <div class="slider-group">
                    <label>完成時間獎勵: <span id="rewTimeTxt" class="stat-val">2.0</span></label>
                    <input type="range" id="rewTimeRange" min="0.0" max="5.0" step="0.5" value="2.0">
                </div>
                <div class="slider-group">
                    <label>平均速度獎勵: <span id="rewSpeedTxt" class="stat-val">1.2</span></label>
                    <input type="range" id="rewSpeedRange" min="0.0" max="3.0" step="0.2" value="1.2">
                </div>
            </div>

            <!-- AI 數量設定 -->
            <div class="panel-section">
                <h3>🚗 車輛與 AI 設定</h3>
                <div class="slider-group">
                    <label>AI 賽車數量 (上限5000): <span id="agentCountTxt" class="stat-val">500</span> 輛</label>
                    <input type="range" id="agentCountRange" min="10" max="5000" step="10" value="500" oninput="updateAgentCount(this.value)">
                </div>
            </div>

            <!-- 超參數調整面板 -->
            <div class="panel-section">
                <h3>🧠 Q-Learning 超參數</h3>
                <div class="slider-group">
                    <label>學習率 (Alpha): <span id="alphaTxt">0.25</span></label>
                    <input type="range" id="alphaRange" min="0.05" max="0.8" step="0.05" value="0.25">
                </div>
                <div class="slider-group">
                    <label>折扣因子 (Gamma): <span id="gammaTxt">0.9</span></label>
                    <input type="range" id="gammaRange" min="0.5" max="0.99" step="0.01" value="0.9">
                </div>
                <div class="slider-group">
                    <label>探索率 (Epsilon): <span id="epsTxt">0.15</span></label>
                    <input type="range" id="epsRange" min="0.0" max="0.8" step="0.05" value="0.15">
                </div>
                <div class="btn-group" style="margin-top: 6px;">
                    <button class="secondary" onclick="saveBrain()">💾 儲存大腦</button>
                    <button class="danger" onclick="clearBrain()">🗑️ 清空記憶</button>
                </div>
            </div>

            <!-- 戰況統計 -->
            <div class="panel-section">
                <h3>📊 戰況統計</h3>
                <div class="stat-row"><span>世代數 (Gen):</span> <span id="genVal" class="stat-val">1</span></div>
                <div class="stat-row"><span>存活賽車:</span> <span id="aliveVal" class="stat-val">0 / 500</span></div>
                <div class="stat-row"><span>完成終點數:</span> <span id="winCountVal" class="stat-val">0</span></div>
                <div class="stat-row"><span>Q-Table 記憶狀態:</span> <span id="qStatesVal" class="stat-val">0</span></div>
            </div>

            <div class="instructions">
                <strong>💡 提示：</strong> 可自由調整得分與減分區塊，即時形塑 AI 的駕駛風格與過彎策略！
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("simCanvas");
        const ctx = canvas.getContext("2d");
        const statsCanvas = document.getElementById("statsCanvas");
        const statsCtx = statsCanvas.getContext("2d");

        // UI 元素
        const genValEl = document.getElementById("genVal");
        const aliveValEl = document.getElementById("aliveVal");
        const winCountValEl = document.getElementById("winCountVal");
        const qStatesValEl = document.getElementById("qStatesVal");
        const alphaRange = document.getElementById("alphaRange");
        const gammaRange = document.getElementById("gammaRange");
        const epsRange = document.getElementById("epsRange");

        // 獎懲調整滑桿
        const rewWinRange = document.getElementById("rewWinRange");
        const rewCrashRange = document.getElementById("rewCrashRange");
        const rewDistRange = document.getElementById("rewDistRange");
        const rewTimeRange = document.getElementById("rewTimeRange");
        const rewSpeedRange = document.getElementById("rewSpeedRange");

        let REW_WIN = parseFloat(rewWinRange.value);
        let REW_CRASH = parseFloat(rewCrashRange.value);
        let REW_DIST = parseFloat(rewDistRange.value);
        let REW_TIME = parseFloat(rewTimeRange.value);
        let REW_SPEED = parseFloat(rewSpeedRange.value);

        rewWinRange.oninput = (e) => { REW_WIN = parseFloat(e.target.value); document.getElementById("rewWinTxt").innerText = REW_WIN; };
        rewCrashRange.oninput = (e) => { REW_CRASH = parseFloat(e.target.value); document.getElementById("rewCrashTxt").innerText = REW_CRASH; };
        rewDistRange.oninput = (e) => { REW_DIST = parseFloat(e.target.value); document.getElementById("rewDistTxt").innerText = REW_DIST; };
        rewTimeRange.oninput = (e) => { REW_TIME = parseFloat(e.target.value); document.getElementById("rewTimeTxt").innerText = REW_TIME; };
        rewSpeedRange.oninput = (e) => { REW_SPEED = parseFloat(e.target.value); document.getElementById("rewSpeedTxt").innerText = REW_SPEED; };

        // 超參數
        let ALPHA = parseFloat(alphaRange.value);
        let GAMMA = parseFloat(gammaRange.value);
        let EPSILON = parseFloat(epsRange.value);
        let numAgents = 500;
        let isPaused = false;
        let isDualSimActive = true;

        alphaRange.oninput = (e) => { ALPHA = parseFloat(e.target.value); document.getElementById("alphaTxt").innerText = ALPHA; };
        gammaRange.oninput = (e) => { GAMMA = parseFloat(e.target.value); document.getElementById("gammaTxt").innerText = GAMMA; };
        epsRange.oninput = (e) => { EPSILON = parseFloat(e.target.value); document.getElementById("epsTxt").innerText = EPSILON; };

        // 賽道資料
        let editTool = 'wall';
        let isMouseDown = false;
        let startPoint = { x: 80, y: 380, angle: -Math.PI / 2 };
        let finishArea = { x: 720, y: 40, w: 90, h: 90 };
        let walls = [];

        let generation = 1;
        let totalWins = 0;
        let qTable = JSON.parse(localStorage.getItem("q_5000_brain")) || {};
        let agents = [];

        // 歷史統計記錄（用於折線圖）
        let historyStats = []; // [{gen, avgScore, maxScore, wins}]

        function saveBrain() {
            localStorage.setItem("q_5000_brain", JSON.stringify(qTable));
            alert("💾 AI 大腦已成功儲存至瀏覽器！");
        }

        function clearBrain() {
            if (confirm("⚠️ 確定要清空所有 AI 大腦記憶嗎？")) {
                qTable = {};
                localStorage.removeItem("q_5000_brain");
                generation = 1;
                totalWins = 0;
                historyStats = [];
                resetSimulation();
            }
        }

        function togglePause() {
            isPaused = !isPaused;
            document.getElementById("pauseBtn").innerText = isPaused ? "恢復演化" : "暫停演化";
            document.getElementById("pauseBtn").className = isPaused ? "success" : "secondary";
        }

        function toggleDualSimMode() {
            isDualSimActive = !isDualSimActive;
            let btn = document.getElementById("simToggleBtn");
            btn.innerText = isDualSimActive ? "雙模擬器 (背景加速)" : "單模擬器 (正常模式)";
            btn.className = isDualSimActive ? "success" : "secondary";
        }

        function setEditTool(tool) {
            editTool = tool;
            document.querySelectorAll('.edit-mode button').forEach(b => b.classList.remove('active'));
            if (tool === 'wall') document.getElementById('toolWallBtn').classList.add('active');
            if (tool === 'start') document.getElementById('toolStartBtn').classList.add('active');
            if (tool === 'finish') document.getElementById('toolFinishBtn').classList.add('active');
            if (tool === 'erase') document.getElementById('toolEraseBtn').classList.add('active');
        }

        function loadPresetTrack() {
            walls = [];
            let w = canvas.width, h = canvas.height;
            addWallBox(20, 20, w - 40, h - 40);
            addWallBox(160, 120, w - 320, h - 240);
            walls.push({ x1: 300, y1: 120, x2: 300, y2: 260 });
            walls.push({ x1: 550, y1: 220, x2: 550, y2: 360 });

            startPoint = { x: 90, y: 390, angle: -Math.PI / 2 };
            finishArea = { x: 720, y: 340, w: 90, h: 90 };
            resetSimulation();
        }

        function clearTrack() {
            walls = [];
            addWallBox(10, 10, canvas.width - 20, canvas.height - 20);
            resetSimulation();
        }

        function addWallBox(x, y, bw, bh) {
            walls.push({ x1: x, y1: y, x2: x + bw, y2: y });
            walls.push({ x1: x + bw, y1: y, x2: x + bw, y2: y + bh });
            walls.push({ x1: x + bw, y1: y + bh, x2: x, y2: y + bh });
            walls.push({ x1: x, y1: y + bh, x2: x, y1: y });
        }

        let lastMousePos = null;
        canvas.addEventListener('mousedown', (e) => {
            isMouseDown = true;
            let rect = canvas.getBoundingClientRect();
            let mx = e.clientX - rect.left, my = e.clientY - rect.top;
            if (editTool === 'start') { startPoint.x = mx; startPoint.y = my; resetSimulation(); }
            else if (editTool === 'finish') { finishArea.x = mx - 45; finishArea.y = my - 45; }
            else if (editTool === 'erase') {
                walls = walls.filter(w => Math.hypot(mx - w.x1, my - w.y1) > 25);
            }
            lastMousePos = { x: mx, y: my };
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isMouseDown) return;
            let rect = canvas.getBoundingClientRect();
            let mx = e.clientX - rect.left, my = e.clientY - rect.top;
            if (editTool === 'wall' && lastMousePos) {
                if (Math.hypot(mx - lastMousePos.x, my - lastMousePos.y) > 12) {
                    walls.push({ x1: lastMousePos.x, y1: lastMousePos.y, x2: mx, y2: my });
                    lastMousePos = { x: mx, y: my };
                }
            } else if (editTool === 'erase') {
                walls = walls.filter(w => Math.hypot(mx - w.x1, my - w.y1) > 25);
            }
        });
        window.addEventListener('mouseup', () => { isMouseDown = false; lastMousePos = null; });

        function getLineIntersection(x1, y1, x2, y2, x3, y3, x4, y4) {
            let denom = (y4 - y3) * (x2 - x1) - (x4 - x3) * (y2 - y1);
            if (denom === 0) return null;
            let ua = ((x4 - x3) * (y1 - y3) - (y4 - y3) * (x1 - x3)) / denom;
            let ub = ((x2 - x1) * (y1 - y3) - (y2 - y1) * (x1 - x3)) / denom;
            if (ua >= 0 && ua <= 1 && ub >= 0 && ub <= 1) return { distFrac: ua };
            return null;
        }

        class Car {
            constructor() {
                this.color = `hsl(${Math.random() * 360}, 85%, 60%)`;
                this.reset();
            }

            reset() {
                this.x = startPoint.x;
                this.y = startPoint.y;
                this.angle = startPoint.angle;
                this.speed = 0;
                this.maxSpeed = 4.8;
                this.radius = 9;
                this.isAlive = true;
                this.hasWon = false;
                this.survivalTime = 0;
                this.totalScore = 0;
                this.lastStateKey = null;
                this.lastAction = null;
            }

            getSensors() {
                let angles = [-Math.PI/2, -Math.PI/4, 0, Math.PI/4, Math.PI/2];
                let readings = [];
                for (let a of angles) {
                    let rayAngle = this.angle + a;
                    let rx = this.x + Math.cos(rayAngle) * 120;
                    let ry = this.y + Math.sin(rayAngle) * 120;
                    let closest = 120;
                    for (let w of walls) {
                        let hit = getLineIntersection(this.x, this.y, rx, ry, w.x1, w.y1, w.x2, w.y2);
                        if (hit && hit.distFrac * 120 < closest) closest = hit.distFrac * 120;
                    }
                    if (closest < 25) readings.push(0);
                    else if (closest < 60) readings.push(1);
                    else readings.push(2);
                }
                return readings;
            }

            getStateKey() {
                let s = this.getSensors();
                let spd = this.speed > 2.5 ? 1 : 0;
                return `${s[0]}_${s[1]}_${s[2]}_${s[3]}_${s[4]}_${spd}`;
            }

            chooseAction(stateKey) {
                if (!qTable[stateKey]) qTable[stateKey] = { 0: 0, 1: 0, 2: 0, 3: 0 };
                if (Math.random() < EPSILON) return Math.floor(Math.random() * 4);
                let actions = qTable[stateKey];
                let bestA = 0, maxQ = -99999;
                for (let a = 0; a < 4; a++) {
                    if (actions[a] > maxQ) { maxQ = actions[a]; bestA = a; }
                }
                return bestA;
            }

            update() {
                if (!this.isAlive || this.hasWon) return;

                this.survivalTime += 1;
                let stateKey = this.getStateKey();
                let action = this.chooseAction(stateKey);

                let sensors = this.getSensors();
                if (sensors[0] === 0 || sensors[4] === 0) {
                    this.speed = Math.max(1.0, this.speed - 0.25);
                }

                if (action === 0) this.angle -= 0.08;
                else if (action === 1) this.angle += 0.08;
                else if (action === 2) this.speed = Math.min(this.maxSpeed, this.speed + 0.2);
                else if (action === 3) this.speed = Math.max(0.8, this.speed - 0.2);

                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;

                let hitWall = false;
                for (let w of walls) {
                    let l2 = (w.x2 - w.x1)**2 + (w.y2 - w.y1)**2;
                    let t = l2 === 0 ? 0 : ((this.x - w.x1)*(w.x2 - w.x1) + (this.y - w.y1)*(w.y2 - w.y1)) / l2;
                    t = Math.max(0, Math.min(1, t));
                    let d = Math.hypot(this.x - (w.x1 + t*(w.x2 - w.x1)), this.y - (w.y1 + t*(w.y2 - w.y1)));
                    if (d < this.radius) { hitWall = true; break; }
                }

                // 終點檢測
                if (this.x >= finishArea.x && this.x <= finishArea.x + finishArea.w &&
                    this.y >= finishArea.y && this.y <= finishArea.y + finishArea.h) {
                    this.hasWon = true;
                    totalWins++;
                }

                if (hitWall) this.isAlive = false;

                // 綜合計算得分 (根據自訂獎懲參數)
                let distToFinish = Math.hypot(this.x - (finishArea.x + finishArea.w/2), this.y - (finishArea.y + finishArea.h/2));
                let pathReward = (800 - distToFinish) * 0.05 * REW_DIST;

                let reward = hitWall ? REW_CRASH : (this.hasWon ? REW_WIN + (500 - this.survivalTime) * REW_TIME : pathReward + this.speed * REW_SPEED);
                this.totalScore += reward;

                let nextState = this.getStateKey();
                if (this.lastStateKey !== null && this.lastAction !== null) {
                    if (!qTable[this.lastStateKey]) qTable[this.lastStateKey] = { 0: 0, 1: 0, 2: 0, 3: 0 };
                    if (!qTable[nextState]) qTable[nextState] = { 0: 0, 1: 0, 2: 0, 3: 0 };
                    let oldQ = qTable[this.lastStateKey][this.lastAction];
                    let maxNextQ = Math.max(...Object.values(qTable[nextState]));
                    qTable[this.lastStateKey][this.lastAction] = oldQ + ALPHA * (reward + GAMMA * maxNextQ - oldQ);
                }
                this.lastStateKey = stateKey;
                this.lastAction = action;
            }

            draw() {
                if (!this.isAlive) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.fillStyle = this.color;
                ctx.fillRect(-12, -7, 24, 14);
                ctx.fillStyle = '#111';
                ctx.fillRect(0, -5, 5, 10);
                ctx.fillStyle = '#fff';
                ctx.fillRect(10, -6, 3, 3);
                ctx.fillRect(10, 3, 3, 3);
                ctx.restore();
            }
        }

        function updateAgentCount(val) {
            numAgents = parseInt(val);
            document.getElementById("agentCountTxt").innerText = numAgents;
            resetSimulation();
        }

        function resetSimulation() {
            // 計算上一代平均得分與勝場並記錄到圖表
            if (agents.length > 0) {
                let totalScore = agents.reduce((sum, a) => sum + a.totalScore, 0);
                let avgScore = totalScore / agents.length;
                let maxScore = Math.max(...agents.map(a => a.totalScore));
                let genWins = agents.filter(a => a.hasWon).length;
                historyStats.push({ gen: generation, avgScore, maxScore, wins: genWins });
                if (historyStats.length > 25) historyStats.shift();
            }

            agents = [];
            for (let i = 0; i < numAgents; i++) agents.push(new Car());
        }

        loadPresetTrack();

        function renderStatsChart() {
            statsCtx.clearRect(0, 0, statsCanvas.width, statsCanvas.height);
            if (historyStats.length < 2) {
                statsCtx.fillStyle = "#666";
                statsCtx.font = "12px sans-serif";
                statsCtx.fillText("累積世代資料中 (需完成至少2個世代)...", 20, 70);
                return;
            }

            let maxScore = Math.max(...historyStats.map(h => h.maxScore), 100);
            let minScore = Math.min(...historyStats.map(h => h.avgScore), -100);
            let range = maxScore - minScore || 1;

            let w = statsCanvas.width;
            let h = statsCanvas.height;
            let dx = w / (historyStats.length - 1);

            // 繪製平均得分折線
            statsCtx.strokeStyle = "#3498db";
            statsCtx.lineWidth = 2;
            statsCtx.beginPath();
            historyStats.forEach((st, i) => {
                let x = i * dx;
                let y = h - ((st.avgScore - minScore) / range) * (h - 30) - 15;
                if (i === 0) statsCtx.moveTo(x, y); else statsCtx.lineTo(x, y);
            });
            statsCtx.stroke();

            // 繪製最高得分折線
            statsCtx.strokeStyle = "#2ecc71";
            statsCtx.beginPath();
            historyStats.forEach((st, i) => {
                let x = i * dx;
                let y = h - ((st.maxScore - minScore) / range) * (h - 30) - 15;
                if (i === 0) statsCtx.moveTo(x, y); else statsCtx.lineTo(x, y);
            });
            statsCtx.stroke();

            // 圖例說明
            statsCtx.fillStyle = "#3498db"; statsCtx.fillRect(15, 8, 10, 6);
            statsCtx.fillStyle = "#aaa"; statsCtx.font = "10px sans-serif"; statsCtx.fillText("平均得分", 30, 14);
            statsCtx.fillStyle = "#2ecc71"; statsCtx.fillRect(95, 8, 10, 6);
            statsCtx.fillStyle = "#aaa"; statsCtx.fillText("最高得分", 110, 14);
        }

        function renderScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 終點與起點
            ctx.fillStyle = "#27ae60";
            ctx.fillRect(finishArea.x, finishArea.y, finishArea.w, finishArea.h);
            ctx.fillStyle = "#fff"; ctx.font = "bold 13px sans-serif";
            ctx.fillText("🏁 終點", finishArea.x + 25, finishArea.y + 55);

            ctx.fillStyle = "rgba(52, 152, 219, 0.4)";
            ctx.beginPath(); ctx.arc(startPoint.x, startPoint.y, 18, 0, Math.PI*2); ctx.fill();

            // 牆壁
            ctx.strokeStyle = "#e74c3c"; ctx.lineWidth = 5; ctx.lineCap = "round";
            for (let w of walls) {
                ctx.beginPath(); ctx.moveTo(w.x1, w.y1); ctx.lineTo(w.x2, w.y2); ctx.stroke();
            }

            let aliveCount = 0;
            for (let agent of agents) {
                if (agent.isAlive && !agent.hasWon) {
                    aliveCount++;
                    agent.draw();
                }
            }

            genValEl.innerText = generation;
            aliveValEl.innerText = `${aliveCount} / ${numAgents}`;
            winCountValEl.innerText = totalWins;
            qStatesValEl.innerText = Object.keys(qTable).length;

            renderStatsChart();
        }

        function gameLoop() {
            if (!isPaused) {
                let iterations = isDualSimActive ? 4 : 1;
                for (let it = 0; it < iterations; it++) {
                    let aliveCount = 0;
                    for (let agent of agents) {
                        if (agent.isAlive && !agent.hasWon) {
                            agent.update();
                            aliveCount++;
                        }
                    }
                    if (aliveCount === 0) {
                        generation++;
                        resetSimulation();
                        break;
                    }
                }
            }
            renderScene();
            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
