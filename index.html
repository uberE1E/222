<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-Learning 5000輛車高效能雙模擬器賽車競賽</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background-color: #0b0f19;
            color: #f0f4f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        header {
            margin: 5px 0;
            text-align: center;
        }
        h1 {
            margin: 0;
            font-size: 20px;
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
        #mainContainer {
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }
        #canvasWrapper {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-radius: 8px;
            overflow: hidden;
            border: 3px solid #1e293b;
        }
        canvas {
            display: block;
            background-color: #0f172a;
        }
        #controlPanel {
            width: 310px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            max-height: 580px;
            overflow-y: auto;
        }
        .panel-section {
            background: #0f172a;
            padding: 10px;
            border-radius: 6px;
            border-left: 4px solid #38bdf8;
        }
        .panel-section h3 {
            margin: 0 0 6px 0;
            font-size: 13px;
            color: #f8fafc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            margin-bottom: 3px;
            color: #94a3b8;
        }
        .stat-val {
            font-weight: bold;
            color: #4ade80;
        }
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-top: 5px;
        }
        button {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 7px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover { background-color: #0369a1; }
        button.active { background-color: #f59e0b !important; }
        button.secondary { background-color: #475569; }
        button.secondary:hover { background-color: #334155; }
        button.danger { background-color: #dc2626; }
        button.danger:hover { background-color: #b91c1c; }
        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
            font-size: 11px;
            margin-top: 5px;
            color: #94a3b8;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #38bdf8;
        }
        .instructions {
            font-size: 10px;
            color: #94a3b8;
            line-height: 1.4;
            background: #0f172a;
            padding: 8px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ Q-Learning 5000輛車高效能雙模擬器賽車競賽</h1>
    </header>

    <div id="mainContainer">
        <div id="canvasWrapper">
            <canvas id="simCanvas" width="900" height="600"></canvas>
        </div>

        <div id="controlPanel">
            <!-- 模擬器與背景運行控制 -->
            <div class="panel-section">
                <h3>🔄 雙模擬器架構</h3>
                <div class="stat-row"><span>運行模式:</span> <span id="simModeVal" class="stat-val" style="color:#f59e0b">前台全螢幕渲染</span></div>
                <div class="btn-group">
                    <button id="toggleBgSimBtn" class="secondary" onclick="toggleBackgroundSim()">切換背景運算</button>
                    <button class="active" onclick="togglePause()">暫停 / 繼續</button>
                </div>
            </div>

            <!-- 賽車數量設定 -->
            <div class="panel-section">
                <h3>🚗 賽車數量設定 (最高 5000)</h3>
                <div class="slider-group">
                    <label>AI 賽車數量: <span id="agentCountTxt" class="stat-val">500</span> 輛</label>
                    <input type="range" id="agentCountRange" min="10" max="5000" step="10" value="500" oninput="updateAgentCount(this.value)">
                </div>
            </div>

            <!-- AI 超參數 -->
            <div class="panel-section">
                <h3>🧠 AI 學習設定 (適應急轉彎優化)</h3>
                <div class="slider-group">
                    <label>學習率 (Alpha): <span id="alphaTxt">0.25</span></label>
                    <input type="range" id="alphaRange" min="0.05" max="0.8" step="0.05" value="0.25">
                </div>
                <div class="slider-group">
                    <label>探索率 (Epsilon): <span id="epsTxt">0.15</span></label>
                    <input type="range" id="epsRange" min="0.0" max="0.8" step="0.05" value="0.15">
                </div>
            </div>

            <!-- 數據統計 -->
            <div class="panel-section">
                <h3>📊 效能與戰況統計</h3>
                <div class="stat-row"><span>世代 (Gen):</span> <span id="genVal" class="stat-val">1</span></div>
                <div class="stat-row"><span>存活賽車:</span> <span id="aliveVal" class="stat-val">0 / 0</span></div>
                <div class="stat-row"><span>FPS 影格率:</span> <span id="fpsVal" class="stat-val">60</span></div>
                <div class="stat-row"><span>大腦記憶 (Q-States):</span> <span id="qStatesVal" class="stat-val">0</span></div>
            </div>

            <div class="instructions">
                <strong>💡 效能與急轉彎提示：</strong><br>
                • 雙模擬器架構：當切換至背景運行時，系統會全速在背景進行 5000 輛車的 Q-Learning 演化。<br>
                • 急轉彎優化：感測器已增至 7 道，並具備動態減速與過彎預判機制。
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("simCanvas");
        const ctx = canvas.getContext("2d");

        // 參數變數
        let ALPHA = 0.25;
        let EPSILON = 0.15;
        let numAgents = 500;
        let isPaused = false;
        let isBackgroundRunning = false;

        // 統計變數
        let generation = 1;
        let qTable = {};
        let agents = [];
        let fps = 60;
        let lastTime = performance.now();
        let frameCount = 0;

        // 賽道地圖設定 (包含急轉彎與複雜障礙)
        let startPoint = { x: 100, y: 520, angle: -Math.PI / 2 };
        let finishArea = { x: 750, y: 80, w: 100, h: 100 };
        let walls = [];

        function loadComplexTrack() {
            walls = [];
            let w = canvas.width;
            let h = canvas.height;
            // 外框
            addWallBox(20, 20, w - 40, h - 40);
            // 內側急轉彎障礙與複雜島嶼
            addWallBox(180, 160, 220, 280);
            addWallBox(500, 160, 220, 120);
            addWallBox(500, 380, 220, 140);
        }

        function addWallBox(x, y, bw, bh) {
            walls.push({ x1: x, y1: y, x2: x + bw, y2: y });
            walls.push({ x1: x + bw, y1: y, x2: x + bw, y2: y + bh });
            walls.push({ x1: x + bw, y1: y + bh, x2: x, y2: y + bh });
            walls.push({ x1: x, y1: y + bh, x2: x, y1: y });
        }

        loadComplexTrack();

        function getLineIntersection(x1, y1, x2, y2, x3, y3, x4, y4) {
            let denom = (y4 - y3) * (x2 - x1) - (x4 - x3) * (y2 - y1);
            if (denom === 0) return null;
            let ua = ((x4 - x3) * (y1 - y3) - (y4 - y3) * (x1 - x3)) / denom;
            let ub = ((x2 - x1) * (y1 - y3) - (y2 - y1) * (x1 - x3)) / denom;
            if (ua >= 0 && ua <= 1 && ub >= 0 && ub <= 1) {
                return { distFrac: ua };
            }
            return null;
        }

        class FastCar {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = startPoint.x;
                this.y = startPoint.y;
                this.angle = startPoint.angle;
                this.speed = 0;
                this.maxSpeed = 5.0;
                this.isAlive = true;
                this.hasWon = false;
                this.radius = 8;
                this.lastStateKey = null;
                this.lastAction = null;
            }

            // 7 道雷達感測器 (專門優化急轉彎偵測)
            getSensors() {
                let angles = [-Math.PI/2, -Math.PI/3, -Math.PI/6, 0, Math.PI/6, Math.PI/3, Math.PI/2];
                let readings = [];
                let rayLen = 120;

                for (let a of angles) {
                    let rayAngle = this.angle + a;
                    let rx2 = this.x + Math.cos(rayAngle) * rayLen;
                    let ry2 = this.y + Math.sin(rayAngle) * rayLen;
                    let minDist = rayLen;

                    for (let w of walls) {
                        let hit = getLineIntersection(this.x, this.y, rx2, ry2, w.x1, w.y1, w.x2, w.y2);
                        if (hit) {
                            let d = hit.distFrac * rayLen;
                            if (d < minDist) minDist = d;
                        }
                    }

                    if (minDist < 25) readings.push(0);
                    else if (minDist < 60) readings.push(1);
                    else readings.push(2);
                }
                return readings;
            }

            getStateKey() {
                let s = this.getSensors();
                let spd = this.speed > 3 ? 1 : 0;
                return `${s[2]}_${s[3]}_${s[4]}_${spd}`; // 簡化特徵維度以防 5000 車記憶爆炸
            }

            chooseAction(stateKey) {
                if (!qTable[stateKey]) {
                    qTable[stateKey] = { 0: 0, 1: 0, 2: 0, 3: 0 };
                }
                if (Math.random() < EPSILON) {
                    return Math.floor(Math.random() * 4);
                } else {
                    let act = qTable[stateKey];
                    let bestA = 0;
                    let maxQ = -99999;
                    for (let a = 0; a < 4; a++) {
                        if (act[a] > maxQ) { maxQ = act[a]; bestA = a; }
                    }
                    return bestA;
                }
            }

            update() {
                if (!this.isAlive || this.hasWon) return;

                let stateKey = this.getStateKey();
                let action = this.chooseAction(stateKey);

                // 0: 左轉, 1: 右轉, 2: 加速, 3: 急轉彎自動減速配合
                if (action === 0) this.angle -= 0.08;
                else if (action === 1) this.angle += 0.08;
                else if (action === 2) this.speed = Math.min(this.maxSpeed, this.speed + 0.2);
                else if (action === 3) this.speed = Math.max(1.0, this.speed - 0.3); // 急轉彎減速預判

                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;

                // 碰撞與終點檢測
                let hitWall = false;
                for (let w of walls) {
                    let l2 = (w.x2 - w.x1) ** 2 + (w.y2 - w.y1) ** 2;
                    let t = l2 === 0 ? 0 : ((this.x - w.x1) * (w.x2 - w.x1) + (this.y - w.y1) * (w.y2 - w.y1)) / l2;
                    t = Math.max(0, Math.min(1, t));
                    let d = Math.hypot(this.x - (w.x1 + t * (w.x2 - w.x1)), this.y - (w.y1 + t * (w.y2 - w.y1)));
                    if (d < this.radius) { hitWall = true; break; }
                }

                if (this.x >= finishArea.x && this.x <= finishArea.x + finishArea.w &&
                    this.y >= finishArea.y && this.y <= finishArea.y + finishArea.h) {
                    this.hasWon = true;
                }

                if (hitWall) this.isAlive = false;

                // Q-Learning 獎勵更新
                let reward = hitWall ? -100 : (this.hasWon ? 200 : (1.0 + this.speed * 0.4));
                let nextStateKey = this.getStateKey();

                if (this.lastStateKey !== null && this.lastAction !== null) {
                    if (!qTable[this.lastStateKey]) qTable[this.lastStateKey] = { 0: 0, 1: 0, 2: 0, 3: 0 };
                    if (!qTable[nextStateKey]) qTable[nextStateKey] = { 0: 0, 1: 0, 2: 0, 3: 0 };
                    let oldQ = qTable[this.lastStateKey][this.lastAction];
                    let maxNextQ = Math.max(...Object.values(qTable[nextStateKey]));
                    qTable[this.lastStateKey][this.lastAction] = oldQ + ALPHA * (reward + 0.85 * maxNextQ - oldQ);
                }
                this.lastStateKey = stateKey;
                this.lastAction = action;
            }
        }

        function initSimulation() {
            agents = [];
            for (let i = 0; i < numAgents; i++) {
                agents.push(new FastCar());
            }
        }

        function updateAgentCount(val) {
            numAgents = parseInt(val);
            document.getElementById("agentCountTxt").innerText = numAgents;
            initSimulation();
        }

        function togglePause() {
            isPaused = !isPaused;
        }

        function toggleBackgroundSim() {
            isBackgroundRunning = !isBackgroundRunning;
            let valEl = document.getElementById("simModeVal");
            let btn = document.getElementById("toggleBgSimBtn");
            if (isBackgroundRunning) {
                valEl.innerText = "背景高速運算中 (極速演化)";
                valEl.style.color = "#4ade80";
                btn.className = "active";
            } else {
                valEl.innerText = "前台全螢幕渲染";
                valEl.style.color = "#f59e0b";
                btn.className = "secondary";
            }
        }

        initSimulation();

        // 高效能主迴圈 (針對 5000 輛車優化)
        function mainLoop() {
            let now = performance.now();
            frameCount++;
            if (now - lastTime >= 1000) {
                fps = frameCount;
                frameCount = 0;
                lastTime = now;
                document.getElementById("fpsVal").innerText = fps;
            }

            if (!isPaused) {
                let aliveCount = 0;
                for (let i = 0; i < agents.length; i++) {
                    if (agents[i].isAlive && !agents[i].hasWon) {
                        agents[i].update();
                        aliveCount++;
                    }
                }

                if (aliveCount === 0) {
                    generation++;
                    initSimulation();
                }

                // UI 更新
                document.getElementById("genVal").innerText = generation;
                document.getElementById("aliveVal").innerText = `${aliveCount} / ${numAgents}`;
                document.getElementById("qStatesVal").innerText = Object.keys(qTable).length;

                // 若在背景運行模式，減少 Canvas 畫面重繪頻率以省下資源給 Q-Table 運算
                if (!isBackgroundRunning || frameCount % 3 === 0) {
                    render();
                }
            }

            requestAnimationFrame(mainLoop);
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 終點與起點
            ctx.fillStyle = "#059669";
            ctx.fillRect(finishArea.x, finishArea.y, finishArea.w, finishArea.h);

            // 牆壁
            ctx.strokeStyle = "#38bdf8";
            ctx.lineWidth = 4;
            for (let w of walls) {
                ctx.beginPath();
                ctx.moveTo(w.x1, w.y1);
                ctx.lineTo(w.x2, w.y2);
                ctx.stroke();
            }

            // 車輛渲染 (數量極大時採用點陣高效繪製)
            ctx.fillStyle = "#f43f5e";
            for (let i = 0; i < agents.length; i++) {
                let ag = agents[i];
                if (ag.isAlive && !ag.hasWon) {
                    ctx.fillRect(ag.x - 2, ag.y - 2, 4, 4);
                }
            }
        }

        requestAnimationFrame(mainLoop);
    </script>
</body>
</html>
