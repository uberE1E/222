<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極限防關閉貪吃蛇大作戰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700&display=swap');
        .game-font { font-family: 'Press Start 2P', monospace; }
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 select-none">

    <!-- 主遊戲容器 -->
    <div class="w-full max-w-lg bg-slate-900 border-2 border-slate-800 rounded-2xl shadow-2xl p-6 flex flex-col items-center relative overflow-hidden">
        
        <!-- 頂部儀表板 -->
        <div class="w-full flex justify-between items-center mb-5 pb-4 border-b border-slate-800">
            <div class="flex items-center gap-2">
                <span class="text-2xl">🐍</span>
                <h1 class="text-lg font-bold text-cyan-400 tracking-wide">貪吃蛇防禦版</h1>
            </div>
            <div class="flex items-center gap-4">
                <div class="bg-slate-950 px-3 py-1.5 rounded-xl border border-slate-800 text-xs text-slate-400">
                    最高分: <span id="highScore" class="text-amber-400 font-bold game-font text-sm ml-1">0</span>
                </div>
                <div class="bg-slate-950 px-3 py-1.5 rounded-xl border border-slate-800 text-xs text-slate-400">
                    得分: <span id="currentScore" class="text-emerald-400 font-bold game-font text-sm ml-1">0</span>
                </div>
            </div>
        </div>

        <!-- 遊戲畫布與覆蓋層 -->
        <div class="relative mb-5">
            <canvas id="gameCanvas" width="360" height="360" class="bg-slate-950 rounded-xl border-2 border-slate-800/80 shadow-inner block"></canvas>
            
            <!-- 開始/結束 覆蓋面板 -->
            <div id="overlay" class="absolute inset-0 bg-slate-950/90 backdrop-blur-sm rounded-xl flex flex-col items-center justify-center p-6 text-center z-10">
                <h2 id="overlayTitle" class="text-2xl font-bold text-cyan-400 mb-2">準備挑戰！</h2>
                <p id="overlayDesc" class="text-xs text-slate-400 mb-6">點擊下方按鈕或按空白鍵開始遊戲</p>
                <button onclick="startGame()" class="bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-bold py-3 px-8 rounded-xl transition-all shadow-lg shadow-emerald-900/30 transform hover:scale-105 active:scale-95">
                    開始遊戲
                </button>
            </div>
        </div>

        <!-- 操作說明與狀態 -->
        <div class="w-full bg-slate-950 p-4 rounded-xl border border-slate-800/80 text-xs text-slate-400 flex flex-col gap-2">
            <div class="flex justify-between items-center">
                <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span> 防護狀態:</span>
                <span class="text-emerald-400 font-semibold bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20">關閉分頁觸發 10 連確認</span>
            </div>
            <div class="flex justify-between items-center text-[11px] text-slate-500 pt-1 border-t border-slate-900">
                <span>🎮 方向鍵 / WASD 控制</span>
                <span>🔄 重新整理（F5/Ctrl+R/刷新按鈕）自動放行</span>
            </div>
        </div>
    </div>

    <!-- 自訂 10 連確認彈窗 (針對滑鼠離開/關閉動作處理) -->
    <div id="exitModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border-2 border-rose-500/50 rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl relative animate-bounce-short">
            <div class="text-4xl mb-3">⚠️</div>
            <h3 class="text-lg font-bold text-rose-400 mb-1" id="exitTitle">防護警告</h3>
            <p class="text-xs text-slate-300 font-semibold mb-4" id="exitProgress">確定要關閉網頁嗎？ (1/10)</p>
            <p class="text-[11px] text-slate-400 mb-6 bg-slate-950 p-3 rounded-xl border border-slate-800">
                您正試圖離開遊戲！必須連續確認 10 次才能離開。
            </p>
            <div class="flex gap-3">
                <button onclick="cancelExit()" class="w-1/2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-lg shadow-emerald-900/30">
                    留下來玩
                </button>
                <button onclick="confirmExitStep()" class="w-1/2 bg-rose-600 hover:bg-rose-500 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-lg shadow-rose-900/30">
                    確定離開
                </button>
            </div>
        </div>
    </div>

    <script>
        // ----------------------------------------------------
        // 1. Web Audio API 音效生成器
        // ----------------------------------------------------
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'eat') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'die') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        // ----------------------------------------------------
        // 2. 關閉與重新整理精準判斷機制
        // ----------------------------------------------------
        let isRefreshing = false;

        // A. 偵測鍵盤重新整理熱鍵 (F5, Ctrl+R, Cmd+R)
        window.addEventListener('keydown', (e) => {
            if (
                e.key === 'F5' || 
                e.keyCode === 116 || 
                ((e.ctrlKey || e.metaKey) && (e.key === 'r' || e.key === 'R' || e.keyCode === 82))
            ) {
                isRefreshing = true;
            }
        });

        // B. 偵測瀏覽器重新整理 (透過 Performance Navigation API)
        try {
            const navEntries = performance.getEntriesByType('navigation');
            if (navEntries.length > 0 && navEntries[0].type === 'reload') {
                isRefreshing = true;
            } else if (performance.navigation && performance.navigation.type === 1) {
                isRefreshing = true;
            }
        } catch (err) {
            console.log('Navigation timing API verified');
        }

        // C. 監聽前台分頁切換/滑鼠移開視窗頂部 (捕捉試圖關閉視窗的意圖)
        let exitStep = 1;
        const exitModal = document.getElementById('exitModal');

        document.addEventListener('mouseleave', (e) => {
            if (e.clientY <= 10 && !isRefreshing) {
                trigger10StepExitModal();
            }
        });

        function trigger10StepExitModal() {
            if (isRefreshing) return;
            exitStep = 1;
            updateExitModal();
            exitModal.classList.remove('hidden');
        }

        function updateExitModal() {
            document.getElementById('exitProgress').innerText = `確定要關閉網頁嗎？ (${exitStep}/10)`;
        }

        function confirmExitStep() {
            if (exitStep < 10) {
                exitStep++;
                updateExitModal();
            } else {
                // 完成 10 次確認後關閉彈窗放行
                exitModal.classList.add('hidden');
                alert("已完成 10 次確認，已解除關閉防護！");
            }
        }

        function cancelExit() {
            exitStep = 1;
            exitModal.classList.add('hidden');
        }

        // D. 標準 beforeunload 事件處置
        window.addEventListener('beforeunload', (e) => {
            // 如果是重新整理，直接放行，不顯示任何防護提示
            if (isRefreshing) {
                return;
            }

            // 觸發原生 10 連續跳窗確認
            for (let i = 1; i <= 10; i++) {
                const stay = confirm(`確定要關閉網頁嗎？ (${i}/10)\n\n按「取消」繼續留下來玩！`);
                if (stay) {
                    // 使用者點擊取消（選擇留下）
                    e.preventDefault();
                    e.returnValue = '';
                    return '';
                }
            }
        });

        // ----------------------------------------------------
        // 3. 貪吃蛇遊戲核心 logic
        // ----------------------------------------------------
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gridSize = 18;
        const tileCount = canvas.width / gridSize;

        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = 1;
        let dy = 0;
        let nextDx = 1;
        let nextDy = 0;
        let score = 0;
        let highScore = localStorage.getItem('snake_high_score') || 0;
        let gameLoop = null;
        let isPlaying = false;

        document.getElementById('highScore').innerText = highScore;

        // 控制按鍵處理
        document.addEventListener('keydown', handleKeyPress);

        function handleKeyPress(e) {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                e.preventDefault();
            }

            if (!isPlaying && (e.key === ' ' || e.key === 'Enter')) {
                startGame();
                return;
            }

            const key = e.key.toLowerCase();
            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            if ((key === 'arrowleft' || key === 'a') && !goingRight) { nextDx = -1; nextDy = 0; }
            if ((key === 'arrowup' || key === 'w') && !goingDown) { nextDx = 0; nextDy = -1; }
            if ((key === 'arrowright' || key === 'd') && !goingLeft) { nextDx = 1; nextDy = 0; }
            if ((key === 'arrowdown' || key === 's') && !goingUp) { nextDx = 0; nextDy = 1; }
        }

        function startGame() {
            snake = [
                { x: 8, y: 10 },
                { x: 7, y: 10 },
                { x: 6, y: 10 }
            ];
            dx = 1;
            dy = 0;
            nextDx = 1;
            nextDy = 0;
            score = 0;
            isPlaying = true;

            document.getElementById('currentScore').innerText = score;
            document.getElementById('overlay').classList.add('hidden');

            spawnFood();
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, 90);
        }

        function update() {
            dx = nextDx;
            dy = nextDy;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // 撞牆判定
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                playSound('die');
                gameOver('撞到牆壁囉！');
                return;
            }

            // 撞自身判定
            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) {
                    playSound('die');
                    gameOver('咬到自己了！');
                    return;
                }
            }

            snake.unshift(head);

            // 吃食物判定
            if (head.x === food.x && head.y === food.y) {
                playSound('eat');
                score += 10;
                document.getElementById('currentScore').innerText = score;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('snake_high_score', highScore);
                    document.getElementById('highScore').innerText = highScore;
                }
                spawnFood();
            } else {
                snake.pop();
            }

            draw();
        }

        function draw() {
            // 背景清空
            ctx.fillStyle = '#020617';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 微弱網格
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 0.5;
            for (let i = 0; i < canvas.width; i += gridSize) {
                ctx.beginPath();
                ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height);
                ctx.moveTo(0, i); ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            // 繪製食物
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#f43f5e';
            ctx.fillStyle = '#f43f5e';
            ctx.beginPath();
            ctx.arc(
                food.x * gridSize + gridSize / 2, 
                food.y * gridSize + gridSize / 2, 
                gridSize / 2 - 2, 
                0, Math.PI * 2
            );
            ctx.fill();

            // 繪製蛇
            snake.forEach((part, index) => {
                ctx.shadowBlur = index === 0 ? 8 : 0;
                ctx.shadowColor = '#38bdf8';
                ctx.fillStyle = index === 0 ? '#38bdf8' : '#0284c7';

                ctx.fillRect(
                    part.x * gridSize + 1, 
                    part.y * gridSize + 1, 
                    gridSize - 2, 
                    gridSize - 2
                );
            });

            ctx.shadowBlur = 0;
        }

        function spawnFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);

            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) spawnFood();
            });
        }

        function gameOver(reason) {
            clearInterval(gameLoop);
            isPlaying = false;

            document.getElementById('overlayTitle').innerText = '遊戲結束';
            document.getElementById('overlayDesc').innerText = `${reason} 最終得分: ${score}`;
            document.getElementById('overlay').classList.remove('hidden');
        }

        // 初始畫布繪製
        draw();
    </script>
</body>
</html>
