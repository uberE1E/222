<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenAI Hide & Seek 多代理人躲迷藏模擬器</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        h1 {
            margin: 4px 0;
            font-size: 22px;
            color: #58a6ff;
            text-shadow: 0 0 10px rgba(88, 166, 255, 0.4);
        }
        .subtitle {
            font-size: 11px;
            color: #8b949e;
            margin-bottom: 8px;
        }
        #mainContainer {
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }
        canvas {
            border: 3px solid #30363d;
            background-color: #161b22;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-radius: 8px;
        }
        #controlPanel {
            width: 280px;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .panel-section {
            background: #161b22;
            padding: 8px 10px;
            border-radius: 6px;
            border-left: 4px solid #58a6ff;
        }
        .panel-section.seeker { border-left-color: #f85149; }
        .panel-section.hider { border-left-color: #3fb950; }
        .panel-section h3 {
            margin: 0 0 6px 0;
            font-size: 13px;
            color: #fff;
            display: flex;
            justify-content: space-between;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            margin-bottom: 3px;
            color: #8b949e;
        }
        .stat-val { font-weight: bold; color: #58a6ff; }
        button {
            background-color: #238636;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            margin-top: 4px;
        }
        button:hover { background-color: #2ea043; }
        button.secondary { background-color: #30363d; }
        button.secondary:hover { background-color: #484f58; }
        .instructions {
            font-size: 10px;
            color: #8b949e;
            line-height: 1.3;
            background: #161b22;
            padding: 6px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h1>🕵️‍♂️ Multi-Agent Hide & Seek 模擬器</h1>
    <div class="subtitle">致敬 OpenAI 經典多代理人對抗與工具利用研究</div>

    <div id="mainContainer">
        <canvas id="simCanvas" width="800" height="520"></canvas>

        <div id="controlPanel">
            <div class="panel-section hider">
                <h3>🟢 躲藏者 (Hiders)</h3>
                <div class="stat-row"><span>目標:</span> <span>推動箱子建造防禦堡壘</span></div>
                <div class="stat-row"><span>存活狀態:</span> <span id="hiderStatus" class="stat-val">防守中</span></div>
            </div>

            <div class="panel-section seeker">
                <h3>🔴 尋找者 (Seekers)</h3>
                <div class="stat-row"><span>目標:</span> <span>突破障礙尋找躲藏者</span></div>
                <div class="stat-row"><span>狀態:</span> <span id="seekerStatus" class="stat-val">追擊中</span></div>
            </div>

            <div class="panel-section">
                <h3>⚙️ 模擬控制</h3>
                <div class="stat-row"><span>回合時間:</span> <span id="timeVal" class="stat-val">0.0s</span></div>
                <div class="stat-row"><span>當前回合數:</span> <span id="roundVal" class="stat-val">1</span></div>
                <button onclick="resetRound()">🔄 重新開始本回合</button>
                <button class="secondary" onclick="resetAll()">🗑️ 重設所有統計</button>
            </div>

            <div class="instructions">
                <strong>💡 遊戲規則：</strong><br>
                • 遊戲開始有短暫準備期，躲藏者（綠點）會合力將箱子（方塊）推到中央圍成掩體。<br>
                • 尋找者（紅點）解凍後會試圖推開箱子或繞過去抓人！
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("simCanvas");
        const ctx = canvas.getContext("2d");

        // UI 元素
        const timeValEl = document.getElementById("timeVal");
        const roundValEl = document.getElementById("roundVal");
        const hiderStatusEl = document.getElementById("hiderStatus");
        const seekerStatusEl = document.getElementById("seekerStatus");

        let round = 1;
        let roundTime = 0;
        let gamePhase = "PREPARE"; // PREPARE (準備期), SEEK (尋找期)
        let phaseTimer = 4.0; // 4秒準備期

        //  агенты (Agents)
        let hiders = [];
        let seekers = [];
        let boxes = [];

        class Agent {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.radius = 12;
                this.type = type; // 'hider' 或 'seeker'
                this.speed = type === 'hider' ? 2.2 : 2.5;
            }

            update() {
                if (gamePhase === "PREPARE" && this.type === 'seeker') return; // 尋找者初期冷凍

                if (this.type === 'hider') {
                    // 躲藏者策略：前期往中央移動並把箱子往外推，後期躲在箱子後面
                    if (phaseTimer > 0) {
                        let targetX = canvas.width / 2;
                        let targetY = canvas.height / 2;
                        let angle = Math.atan2(targetY - this.y, targetX - this.x);
                        this.vx = Math.cos(angle) * this.speed;
                        this.vy = Math.sin(angle) * this.speed;
                    } else {
                        // 躲藏階段：隨機在中央基地附近移動躲避
                        if (Math.random() < 0.03) {
                            let angle = Math.random() * Math.PI * 2;
                            this.vx = Math.cos(angle) * this.speed * 0.8;
                            this.vy = Math.sin(angle) * this.speed * 0.8;
                        }
                    }
                } else {
                    // 尋找者策略：尋找離自己最近的躲藏者或推開箱子
                    let target = hiders[0];
                    let minDist = 99999;
                    for (let h of hiders) {
                        let d = Math.hypot(h.x - this.x, h.y - this.y);
                        if (d < minDist) { minDist = d; target = h; }
                    }
                    if (target) {
                        let angle = Math.atan2(target.y - this.y, target.x - this.x);
                        this.vx = Math.cos(angle) * this.speed;
                        this.vy = Math.sin(angle) * this.speed;
                    }
                }

                //  移動與牆壁碰撞
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 20) { this.x = 20; this.vx *= -1; }
                if (this.x > canvas.width - 20) { this.x = canvas.width - 20; this.vx *= -1; }
                if (this.y < 20) { this.y = 20; this.vy *= -1; }
                if (this.y > canvas.height - 20) { this.y = canvas.height - 20; this.vy *= -1; }

                // 碰撞箱子 (推動物理)
                for (let b of boxes) {
                    let closestX = Math.max(b.x, Math.min(this.x, b.x + b.w));
                    let closestY = Math.max(b.y, Math.min(this.y, b.y + b.h));
                    let dist = Math.hypot(this.x - closestX, this.y - closestY);
                    if (dist < this.radius) {
                        let pushAngle = Math.atan2(this.y - closestY, this.x - closestX);
                        b.vx += Math.cos(pushAngle) * 0.4;
                        b.vy += Math.sin(pushAngle) * 0.4;
                    }
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.type === 'hider' ? '#3fb950' : '#f85149';
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        class Box {
            constructor(x, y, w, h) {
                this.x = x;
                this.y = y;
                this.w = w;
                this.h = h;
                this.vx = 0;
                this.vy = 0;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.85; // 摩擦力減速
                this.vy *= 0.85;

                // 邊界限制
                if (this.x < 15) { this.x = 15; this.vx = 0; }
                if (this.x + this.w > canvas.width - 15) { this.x = canvas.width - 15 - this.w; this.vx = 0; }
                if (this.y < 15) { this.y = 15; this.vy = 0; }
                if (this.y + this.h > canvas.height - 15) { this.y = canvas.height - 15 - this.h; this.vy = 0; }
            }

            draw() {
                ctx.fillStyle = '#d29922';
                ctx.fillRect(this.x, this.y, this.w, this.h);
                ctx.strokeStyle = '#9e6a03';
                ctx.lineWidth = 2;
                ctx.strokeRect(this.x, this.y, this.w, this.h);
            }
        }

        function initSimulation() {
            hiders = [
                new Agent(100, 150, 'hider'),
                new Agent(100, 260, 'hider'),
                new Agent(100, 370, 'hider')
            ];
            seekers = [
                new Agent(700, 200, 'seeker'),
                new Agent(700, 320, 'seeker')
            ];
            boxes = [
                new Box(380, 200, 35, 35),
                new Box(380, 260, 35, 35),
                new Box(380, 320, 35, 35),
                new Box(340, 260, 35, 35)
            ];
            phaseTimer = 4.0;
            gamePhase = "PREPARE";
            roundTime = 0;
        }

        function resetRound() {
            initSimulation();
        }

        function resetAll() {
            round = 1;
            initSimulation();
        }

        initSimulation();

        function gameLoop() {
            // 1. 更新邏輯
            roundTime += 1 / 60;
            if (phaseTimer > 0) {
                phaseTimer -= 1 / 60;
                hiderStatusEl.innerText = "建造堡壘中...";
                seekerStatusEl.innerText = "冷凍等待中...";
                if (phaseTimer <= 0) gamePhase = "SEEK";
            } else {
                hiderStatusEl.innerText = "躲藏防守中";
                seekerStatusEl.innerText = "全力追擊中！";
            }

            for (let b of boxes) b.update();
            for (let h of hiders) h.update();
            for (let s of seekers) s.update();

            // 檢查是否被抓到
            for (let s of seekers) {
                for (let h of hiders) {
                    if (h.isAlive !== false && Math.hypot(s.x - h.x, s.y - h.y) < s.radius + h.radius) {
                        h.isAlive = false; // 標記被抓
                    }
                }
            }

            // 移除被抓到的躲藏者
            hiders = hiders.filter(h => h.isAlive !== false);

            if (hiders.length === 0) {
                round++;
                initSimulation();
            }

            // 2. 渲染畫面
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 繪製地圖圍牆
            ctx.strokeStyle = '#30363d';
            ctx.lineWidth = 4;
            ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);

            // 繪製箱子與代理人
            for (let b of boxes) b.draw();
            for (let h of hiders) h.draw();
            for (let s of seekers) s.draw();

            // 更新 UI 狀態
            timeValEl.innerText = roundTime.toFixed(1) + "s";
            roundValEl.innerText = round;

            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
