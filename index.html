<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雙模擬器高容量 Q-Learning AI 極速競賽 (10000輛車)</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background-color: #0b0b0b;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
        }
        header {
            margin: 5px 0;
            text-align: center;
        }
        h1 {
            margin: 0;
            font-size: 20px;
            color: #f1c40f;
            text-shadow: 0 0 10px rgba(241, 196, 15, 0.4);
        }
        .subtitle {
            font-size: 11px;
            color: #888;
        }
        #mainContainer {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }
        .canvases-wrapper {
            display: flex;
            gap: 10px;
        }
        .canvas-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #181818;
            padding: 6px;
            border-radius: 8px;
            border: 2px solid #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
        }
        .canvas-title {
            font-size: 12px;
            font-weight: bold;
            color: #3498db;
            margin-bottom: 4px;
        }
        canvas {
            background-color: #111;
            border-radius: 4px;
            cursor: crosshair;
        }
        #controlPanel {
            width: 280px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 600px;
            overflow-y: auto;
        }
        .panel-section {
            background: #222;
            padding: 8px;
            border-radius: 6px;
            border-left: 3px solid #e74c3c;
        }
        .panel-section.blue { border-left-color: #3498db; }
        .panel-section h3 {
            margin: 0 0 6px 0;
            font-size: 13px;
            color: #fff;
            display: flex;
            justify-content: space-between;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            margin-bottom: 3px;
            color: #aaa;
        }
        .stat-val {
            font-weight: bold;
            color: #2ecc71;
        }
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            margin-top: 4px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover { background-color: #2980b9; }
        button.secondary { background-color: #444; }
        button.secondary:hover { background-color: #555; }
        button.danger { background-color: #c0392b; }
        button.success { background-color: #27ae60; }
        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
            font-size: 11px;
            margin-top: 4px;
            color: #aaa;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #f1c40f;
        }
        .instructions {
            font-size: 10px;
            color: #777;
            line-height: 1.3;
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ 雙模擬器極速 Q-Learning AI 競技場 (支援 10000 輛車)</h1>
        <div class="subtitle">雙賽道並行訓練 • 共享大腦 • 享受極速狂飆與萬車大混戰</div>
    </header>

    <div id="mainContainer">
        <!-- 雙模擬器畫布容器 -->
        <div class="canvases-wrapper">
            <div class="canvas-box">
                <div class="canvas-title">模擬器賽道 A</div>
                <canvas id="simCanvasA" width="480" height="520"></canvas>
            </div>
            <div class="canvas-box">
                <div class="canvas-title">模擬器賽道 B</div>
                <canvas id="simCanvasB" width="480" height="520"></canvas>
            </div>
        </div>

        <!-- 總控制面板 -->
        <div id="controlPanel">
            <div class="panel-section blue">
                <h3>🚀 車輛與速度設定</h3>
                <div class="slider-group">
                    <label>單一模擬器車輛數: <span id="agentCountTxt" class="stat-val">500</span> 輛</label>
                    <input type="range" id="agentCountRange" min="50" max="5000" step="50" value="500" oninput="updateAgentCount(this.value)">
                    <div style="font-size:9px; color:#e67e22;">(雙模擬器總計最高達 10,000 輛)</div>
                </div>
                <div class="slider-group" style="margin-top:6px;">
                    <label>賽車極速倍率: <span id="speedMultTxt" class="stat-val">1.8x</span></label>
                    <input type="range" id="speedMultRange" min="1.0" max="4.0" step="0.2" value="1.8" oninput="updateSpeedMult(this.value)">
                </div>
            </div>

            <div class="panel-section">
                <h3>🧠 AI 共同學習大腦</h3>
                <div class="stat-row"><span>世代 (Generation):</span> <span id="genVal" class="stat-val">1</span></div>
                <div class="stat-row"><span>大腦記憶數 (Q-States):</span> <span id="qStatesVal" class="stat-val">0</span></div>
                <div class="stat-row"><span>總通關次數:</span> <span id="totalWinsVal" class="stat-val">0</span></div>
                <div class="btn-group" style="margin-top:6px;">
                    <button class="secondary" onclick="saveBrain()">💾 儲存大腦</button>
                    <button class="danger" onclick="clearBrain()">🗑️ 清空記憶</button>
                </div>
            </div>

            <div class="panel-section blue">
                <h3>🛠️ 賽道自訂與重置</h3>
                <div class="btn-group">
                    <button onclick="loadDefaultTracks()">載入預設雙賽道</button>
                    <button class="secondary" onclick="clearAllTracks()">清空賽道</button>
                </div>
            </div>

            <div class="instructions">
                <strong>🕹️ 操作提示：</strong><br>
                • 點擊任一模擬器畫布可繪製牆壁障礙。<br>
                • 萬車模式下畫面可能極度密集，可調整滑桿控制車輛數量。
            </div>
        </div>
    </div>

    <script>
        // 雙模擬器環境設定
        const canvasA = document.getElementById("simCanvasA");
        const ctxA = canvasA.getContext("2d");
        const canvasB = document.getElementById("simCanvasB");
        const ctxB = canvasB.getContext("2d");

        // 參數變數
        let agentsPerSimulator = 500; // 預設單邊 500，雙邊合計 1000，最高可拉至 5000 (共 10000)
        let speedMultiplier = 1.8;
        let ALPHA = 0.2;
        let EPSILON = 0.15;
        let generation = 1;
        let totalWins = 0;

        // 共用 Q-Learning 大腦
        let qTable = JSON.parse(localStorage.getItem("dual_sim_q_table")) || {};

        function saveBrain() {
            localStorage.setItem("dual_sim_q_table", JSON.stringify(qTable));
            alert("💾 雙模擬器共用大腦已成功儲存！");
        }

        function clearBrain() {
            if (confirm("⚠️ 確定要清空大腦記憶嗎？")) {
                qTable = {};
                localStorage.removeItem("dual_sim_q_table");
                generation = 1;
                totalWins = 0;
                initSimulators();
            }
        }

        function updateAgentCount(val) {
            agentsPerSimulator = parseInt(val);
            document.getElementById("agentCountTxt").innerText = agentsPerSimulator;
            initSimulators();
        }

        function updateSpeedMult(val) {
            speedMultiplier = parseFloat(val);
            document.getElementById("speedMultTxt").innerText = speedMultiplier.toFixed(1) + "x";
        }

        // 賽道資料結構 (支援 A 與 B 獨立賽道)
        let wallsA = [];
        let wallsB = [];
        let startPointA = { x: 60, y: 460, angle: -Math.PI / 2 };
        let finishA = { x: 380, y: 60, w: 70, h: 70 };

        let startPointB = { x: 60, y: 460, angle: -Math.PI / 2 };
        let finishB = { x: 380, y: 60, w: 70, h: 70 };

        function loadDefaultTracks() {
            wallsA = [];
            wallsB = [];
            let w = canvasA.width;
            let h = canvasA.height;

            // 賽道 A 邊界與障礙
            addBox(wallsA, 10, 10, w - 20, h - 20);
            addBox(wallsA, 130, 110, w - 260, h - 220);

            // 賽道 B 邊界與不同障礙
            addBox(wallsB, 10, 10, w - 20, h - 20);
            wallsB.push({ x1: 120, y1: 120, x2: 360, y2: 120 });
            wallsB.push({ x1: 120, y1: 380, x2: 360, y2: 380 });

            startPointA = { x: 60, y: 460, angle: -Math.PI / 2 };
            finishA = { x: 380, y: 50, w: 70, h: 70 };

            startPointB = { x: 60, y: 460, angle: -Math.PI / 2 };
            finishB = { x: 380, y: 50, w: 70, h: 70 };

            initSimulators();
        }

        function clearAllTracks() {
            wallsA = [];
            wallsB = [];
            addBox(wallsA, 10, 10, canvasA.width - 20, canvasA.height - 20);
            addBox(wallsB, 10, 10, canvasB.width - 20, canvasB.height - 20);
            initSimulators();
        }

        function addBox(wallArr, x, y, bw, bh) {
            wallArr.push({ x1: x, y1: y, x2: x + bw, y2: y });
            wallArr.push({ x1: x + bw, y1: y, x2: x + bw, y2: y + bh });
            wallArr.push({ x1: x + bw, y1: y + bh, x2: x, y2: y + bh });
            wallArr.push({ x1: x, y1: y + bh, x2: x, y1: y });
        }

        // 幾何工具
        function distToSegment(p, v, w) {
            let l2 = (w.x - v.x) ** 2 + (w.y - v.y) ** 2;
            if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
            let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
        }

        function getLineIntersection(x1, y1, x2, y2, x3, y3, x4, y4) {
            let denom = (y4 - y3) * (x2 - x1) - (x4 - x3) * (y2 - y1);
            if (denom === 0) return null;
            let ua = ((x4 - x3) * (y1 - y3) - (y4 - y3) * (x1 - x3)) / denom;
            let ub = ((x2 - x1) * (y1 - y3) - (y2 - y1) * (x1 - x3)) / denom;
            if (ua >= 0 && ua <= 1 && ub >= 0 && ub <= 1) {
                return { distFrac: ua };
            }
            return null;
        }

        // 賽車類別 (極速優化版)
        class FastCar {
            constructor(sp, fin) {
                this.sp = sp;
                this.fin = fin;
                this.reset();
                this.color = `hsl(${Math.random() * 360}, 80%, 55%)`;
            }

            reset() {
                this.x = this.sp.x;
                this.y = this.sp.y;
                this.angle = this.sp.angle;
                this.speed = 0;
                this.maxSpeed = 5.5 * speedMultiplier;
                this.isAlive = true;
                this.hasWon = false;
                this.radius = 6; // 縮小半徑以容納極高密度車輛

                this.lastStateKey = null;
                this.lastAction = null;
            }

            // 簡易 3 雷達感測以極大化 10000 輛車的計算效能
            getSensors(walls) {
                let angles = [-Math.PI / 3, 0, Math.PI / 3];
                let readings = [];

                for (let a of angles) {
                    let ra = this.angle + a;
                    let rx2 = this.x + Math.cos(ra) * 90;
                    let ry2 = this.y + Math.sin(ra) * 90;
                    let closest = 90;

                    for (let w of walls) {
                        let hit = getLineIntersection(this.x, this.y, rx2, ry2, w.x1, w.y1, w.x2, w.y2);
                        if (hit) {
                            let d = hit.distFrac * 90;
                            if (d < closest) closest = d;
                        }
                    }

                    if (closest < 25) readings.push(0);
                    else if (closest < 55) readings.push(1);
                    else readings.push(2);
                }
                return readings;
            }

            getStateKey(walls) {
                let s = this.getSensors(walls);
                let spd = this.speed > 3 * speedMultiplier ? 1 : 0;
                return `${s[0]}_${s[1]}_${s[2]}_${spd}`;
            }

            chooseAction(stateKey) {
                if (!qTable[stateKey]) {
                    qTable[stateKey] = { 0: 0, 1: 0, 2: 0, 3: 0 };
                }
                if (Math.random() < EPSILON) {
                    return Math.floor(Math.random() * 4);
                } else {
                    let act = qTable[stateKey];
                    let best = 0;
                    let maxQ = -999999;
                    for (let a = 0; a < 4; a++) {
                        if (act[a] > maxQ) { maxQ = act[a]; best = a; }
                    }
                    return best;
                }
            }

            update(walls) {
                if (!this.isAlive || this.hasWon) return;

                let stateKey = this.getStateKey(walls);
                let action = this.chooseAction(stateKey);

                if (action === 0) this.angle -= 0.1; // 左轉
                else if (action === 1) this.angle += 0.1; // 右轉
                else if (action === 2) this.speed = Math.min(this.maxSpeed, this.speed + 0.4); // 急速加速
                else if (action === 3) this.speed = Math.max(1.5, this.speed - 0.3);

                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;

                // 碰撞與抵達終點
                let hit = false;
                for (let w of walls) {
                    if (distToSegment({ x: this.x, y: this.y }, { x: w.x1, y: w.y1 }, { x: w.x2, y: w.y2 }) < this.radius) {
                        hit = true;
                        break;
                    }
                }

                if (this.x >= this.fin.x && this.x <= this.fin.x + this.fin.w &&
                    this.y >= this.fin.y && this.y <= this.fin.y + this.fin.h) {
                    this.hasWon = true;
                    totalWins++;
                }

                if (hit) {
                    this.isAlive = false;
                }

                // Q-Learning 增量學習
                let reward = hit ? -100 : (this.hasWon ? 250 : 1.5 + this.speed * 0.4);
                let nextStateKey = this.getStateKey(walls);

                if (this.lastStateKey !== null && this.lastAction !== null) {
                    if (!qTable[this.lastStateKey]) qTable[this.lastStateKey] = { 0: 0, 1: 0, 2: 0, 3: 0 };
                    if (!qTable[nextStateKey]) qTable[nextStateKey] = { 0: 0, 1: 0, 2: 0, 3: 0 };

                    let oldQ = qTable[this.lastStateKey][this.lastAction];
                    let maxNextQ = Math.max(...Object.values(qTable[nextStateKey]));
                    qTable[this.lastStateKey][this.lastAction] = oldQ + ALPHA * (reward + 0.8 * maxNextQ - oldQ);
                }

                this.lastStateKey = stateKey;
                this.lastAction = action;
            }

            draw(ctx) {
                if (!this.isAlive) return;
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x - 2, this.y - 2, 4, 4); // 極速點狀渲染以確保 10000 輛車不卡頓
            }
        }

        let simulatorA_Agents = [];
        let simulatorB_Agents = [];

        function initSimulators() {
            simulatorA_Agents = [];
            simulatorB_Agents = [];
            for (let i = 0; i < agentsPerSimulator; i++) {
                simulatorA_Agents.push(new FastCar(startPointA, finishA));
                simulatorB_Agents.push(new FastCar(startPointB, finishB));
            }
        }

        // 滑鼠在畫布上繪製牆壁
        let activeCanvas = 'A';
        canvasA.addEventListener('mousedown', () => activeCanvas = 'A');
        canvasB.addEventListener('mousedown', () => activeCanvas = 'B');

        let isDrawing = false;
        let lastPos = null;

        function handleDrawStart(e, cvs) {
            isDrawing = true;
            let rect = cvs.getBoundingClientRect();
            lastPos = { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }

        function handleDrawMove(e, cvs, wallArr) {
            if (!isDrawing) return;
            let rect = cvs.getBoundingClientRect();
            let mx = e.clientX - rect.left;
            let my = e.clientY - rect.top;
            if (Math.hypot(mx - lastPos.x, my - lastPos.y) > 12) {
                wallArr.push({ x1: lastPos.x, y1: lastPos.y, x2: mx, y2: my });
                lastPos = { x: mx, y: my };
            }
        }

        canvasA.addEventListener('mousedown', (e) => handleDrawStart(e, canvasA));
        canvasA.addEventListener('mousemove', (e) => handleDrawMove(e, canvasA, wallsA));
        window.addEventListener('mouseup', () => isDrawing = false);

        canvasB.addEventListener('mousedown', (e) => handleDrawStart(e, canvasB));
        canvasB.addEventListener('mousemove', (e) => handleDrawMove(e, canvasB, wallsB));

        loadDefaultTracks();

        // 渲染與主迴圈
        function renderSim(ctx, cvs, walls, finish, agents, title) {
            ctx.clearRect(0, 0, cvs.width, cvs.height);

            // 終點
            ctx.fillStyle = "#27ae60";
            ctx.fillRect(finish.x, finish.y, finish.w, finish.h);

            // 牆壁
            ctx.strokeStyle = "#e74c3c";
            ctx.lineWidth = 4;
            for (let w of walls) {
                ctx.beginPath();
                ctx.moveTo(w.x1, w.y1);
                ctx.lineTo(w.x2, w.y2);
                ctx.stroke();
            }

            // 車輛
            let alive = 0;
            for (let agent of agents) {
                agent.update(walls);
                agent.draw(ctx);
                if (agent.isAlive && !agent.hasWon) alive++;
            }
            return alive;
        }

        function mainLoop() {
            let aliveA = renderSim(ctxA, canvasA, wallsA, finishA, simulatorA_Agents, "A");
            let aliveB = renderSim(ctxB, canvasB, wallsB, finishB, simulatorB_Agents, "B");

            // 若兩邊都死光，自動進入下一代
            if (aliveA === 0 && aliveB === 0) {
                generation++;
                initSimulators();
            }

            // 更新 UI
            document.getElementById("genVal").innerText = generation;
            document.getElementById("qStatesVal").innerText = Object.keys(qTable).length;
            document.getElementById("totalWinsVal").innerText = totalWins;

            requestAnimationFrame(mainLoop);
        }

        requestAnimationFrame(mainLoop);
    </script>
</body>
</html>
