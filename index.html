<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智慧修圖、優化與腦補圖模擬器</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
            padding: 10px 0;
        }
        h1 {
            margin: 4px 0;
            font-size: 22px;
            color: #58a6ff;
            text-shadow: 0 0 10px rgba(88, 166, 255, 0.4);
        }
        .subtitle {
            font-size: 11px;
            color: #8b949e;
            margin-bottom: 10px;
        }
        #mainContainer {
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }
        #canvasWrapper {
            position: relative;
            background: #161b22;
            border: 2px solid #30363d;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            overflow: hidden;
        }
        canvas {
            display: block;
            cursor: crosshair;
        }
        #controlPanel {
            width: 300px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .panel-section {
            background: #21262d;
            padding: 8px 10px;
            border-radius: 6px;
            border-left: 4px solid #58a6ff;
        }
        .panel-section.ai-mode { border-left-color: #a371f7; }
        .panel-section h3 {
            margin: 0 0 6px 0;
            font-size: 13px;
            color: #f0f6fc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-top: 4px;
        }
        button {
            background-color: #238636;
            color: white;
            border: none;
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover { background-color: #2ea043; transform: translateY(-1px); }
        button.secondary { background-color: #30363d; }
        button.secondary:hover { background-color: #484f58; }
        button.purple { background-color: #8957e5; }
        button.purple:hover { background-color: #a371f7; }
        
        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
            font-size: 11px;
            margin-top: 4px;
            color: #8b949e;
        }
        input[type="range"] { width: 100%; accent-color: #a371f7; }
        
        /* AI 運算進度條遮罩 */
        #loadingOverlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 17, 23, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #a371f7;
            font-weight: bold;
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        #loadingOverlay.active { opacity: 1; pointer-events: auto; }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #30363d;
            border-top: 4px solid #a371f7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .instructions {
            font-size: 10px;
            color: #8b949e;
            line-height: 1.3;
            background: #0d1117;
            padding: 6px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h1>🧠 AI 智慧修圖、優化與腦補模擬器</h1>
    <div class="subtitle">體驗神經網路超解析度升頻、語意修補 (Inpainting) 與擴散模型降噪生成</div>

    <div id="mainContainer">
        <div id="canvasWrapper">
            <canvas id="imageCanvas" width="500" height="400"></canvas>
            <div id="loadingOverlay">
                <div class="spinner"></div>
                <div id="loadingText">AI 正在腦補生成細節 (Diffusion Step 1/20)...</div>
            </div>
        </div>

        <div id="controlPanel">
            <!-- 來源圖片選擇 -->
            <div class="panel-section">
                <h3>🖼️ 選擇測試圖片</h3>
                <div class="btn-group">
                    <button class="secondary" onclick="loadSampleImage('portrait')">👤 人像範例</button>
                    <button class="secondary" onclick="loadSampleImage('landscape')">🌄 風景範例</button>
                </div>
            </div>

            <!-- AI 工具模式 -->
            <div class="panel-section ai-mode">
                <h3>🪄 AI 核心功能</h3>
                <div class="btn-group" style="grid-template-columns: 1fr;">
                    <button class="purple" onclick="runAIProcess('upscale')">✨ AI 超解析度升頻與毛孔/毛髮腦補</button>
                    <button class="purple" onclick="runAIProcess('inpainting')">🪄 智慧語意修補 (自動填補塗抹區)</button>
                    <button class="purple" onclick="runAIProcess('cyberpunk')">🌈 AI 藝術風格神經轉換 (Cyberpunk)</button>
                </div>
            </div>

            <!-- AI 參數微調 -->
            <div class="panel-section">
                <h3>⚙️ AI 腦補強度 (Creativity)</h3>
                <div class="slider-group">
                    <label>幻覺/腦補程度: <span id="creativityVal" class="stat-val" style="color:#a371f7;">0.75</span></label>
                    <input type="range" id="creativityRange" min="0.1" max="1.0" step="0.05" value="0.75" oninput="document.getElementById('creativityVal').innerText=this.value">
                </div>
                <div class="slider-group" style="margin-top: 6px;">
                    <label>畫筆大小 (用於手動塗抹修補): <span id="brushVal">15</span>px</label>
                    <input type="range" id="brushRange" min="5" max="40" step="5" value="15" oninput="document.getElementById('brushVal').innerText=this.value">
                </div>
            </div>

            <!-- 操作按鈕 -->
            <div class="panel-section">
                <h3>🛠️ 畫布操作</h3>
                <div class="btn-group">
                    <button class="secondary" onclick="resetImage()">復原原圖</button>
                    <button class="secondary" onclick="clearMask()">清除塗抹遮罩</button>
                </div>
            </div>

            <div class="instructions">
                <strong>💡 使用提示：</strong> 點擊「智慧語意修補」前，可在畫面上用滑鼠任意塗抹想要修改的區域，AI 就會自動將其「腦補」成完美畫面！
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("imageCanvas");
        const ctx = canvas.getContext("2d");
        const loadingOverlay = document.getElementById("loadingOverlay");
        const loadingText = document.getElementById("loadingText");
        const brushRange = document.getElementById("brushRange");

        let currentMode = 'sample';
        let originalImage = new Image();
        let maskCanvas = document.createElement('canvas');
        let maskCtx = maskCanvas.getContext('2d');
        maskCanvas.width = 500;
        maskCanvas.height = 400;

        let isDrawing = false;

        // 初始化預設圖片 (人像範例)
        function loadSampleImage(type) {
            currentType = type;
            originalImage.onload = () => {
                ctx.drawImage(originalImage, 0, 0, canvas.width, canvas.height);
                clearMask();
            };
            if (type === 'portrait') {
                // 產生一個高質感的人像測試圖 (SVG/Canvas 繪製)
                drawPortraitSample();
            } else {
                drawLandscapeSample();
            }
        }

        function drawPortraitSample() {
            ctx.fillStyle = "#1e293b";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            // 模擬模糊人臉與背景
            let grad = ctx.createRadialGradient(250, 180, 20, 250, 180, 180);
            grad.addColorStop(0, "#fbcfe8");
            grad.addColorStop(0.5, "#cbd5e1");
            grad.addColorStop(1, "#0f172a");
            ctx.fillStyle = grad;
            ctx.fillRect(50, 40, 400, 320);

            // 臉部輪廓
            ctx.fillStyle = "#f43f5e";
            ctx.beginPath(); ctx.arc(250, 170, 75, 0, Math.PI*2); ctx.fill();
            
            // 眼睛與嘴巴 (稍微模糊低畫質感)
            ctx.fillStyle = "#111";
            ctx.fillRect(220, 150, 12, 6);
            ctx.fillRect(268, 150, 12, 6);
            ctx.beginPath(); ctx.arc(250, 200, 15, 0, Math.PI); ctx.stroke();

            // 儲存為基準原圖
            originalImage.src = canvas.toDataURL();
        }

        function drawLandscapeSample() {
            ctx.fillStyle = "#38bdf8";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            // 山脈
            ctx.fillStyle = "#047857";
            ctx.beginPath();
            ctx.moveTo(0, 400); ctx.lineTo(150, 200); ctx.lineTo(300, 350); ctx.lineTo(500, 150); ctx.lineTo(500, 400);
            ctx.fill();
            // 太陽
            ctx.fillStyle = "#facc15";
            ctx.beginPath(); ctx.arc(380, 100, 40, 0, Math.PI*2); ctx.fill();

            originalImage.src = canvas.toDataURL();
        }

        function resetImage() {
            ctx.drawImage(originalImage, 0, 0, canvas.width, canvas.height);
            clearMask();
        }

        function clearMask() {
            maskCtx.clearRect(0, 0, maskCanvas.width, maskCanvas.height);
        }

        // 滑鼠塗抹遮罩 (用於 Inpainting 腦補)
        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            drawMask(e);
        });
        canvas.addEventListener('mousemove', (e) => {
            if (isDrawing) drawMask(e);
        });
        window.addEventListener('mouseup', () => { isDrawing = false; });

        function drawMask(e) {
            let rect = canvas.getBoundingClientRect();
            let x = e.clientX - rect.left;
            let y = e.clientY - rect.top;
            let radius = parseInt(brushRange.value);

            maskCtx.fillStyle = 'rgba(163, 113, 247, 0.6)';
            maskCtx.beginPath();
            maskCtx.arc(x, y, radius, 0, Math.PI * 2);
            maskCtx.fill();

            // 同步顯示在畫布上 (半透明紫色塗抹區)
            redrawCanvasWithMask();
        }

        function redrawCanvasWithMask() {
            ctx.drawImage(originalImage, 0, 0, canvas.width, canvas.height);
            // 疊加遮罩
            ctx.drawImage(maskCanvas, 0, 0);
        }

        // 模擬 AI 處理過程與動畫
        function runAIProcess(mode) {
            loadingOverlay.classList.add("active");
            let steps = 20;
            let currentStep = 1;

            let interval = setInterval(() => {
                if (currentStep <= steps) {
                    loadingText.innerText = `AI 深度神經網路運算中 (${mode.toUpperCase()} - Step ${currentStep}/${steps})...`;
                    currentStep++;
                } else {
                    clearInterval(interval);
                    loadingOverlay.classList.remove("active");
                    applyAIEffect(mode);
                }
            }, 60);
        }

        // 套用 AI 腦補與優化演算法
        function applyAIEffect(mode) {
            let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let data = imgData.data;
            let creativity = parseFloat(document.getElementById("creativityRange").value);

            if (mode === 'upscale') {
                // AI 超解析度腦補：透過強烈對比增強、邊緣銳化與雜訊去除模擬超高清細節
                for (let i = 0; i < data.length; i += 4) {
                    let r = data[i], g = data[i+1], b = data[i+2];
                    // 智慧銳化與飽和度提升
                    data[i] = Math.min(255, r * (1 + 0.2 * creativity));
                    data[i+1] = Math.min(255, g * (1 + 0.2 * creativity));
                    data[i+2] = Math.min(255, b * (1 + 0.2 * creativity));
                }
                ctx.putImageData(imgData, 0, 0);
                // 額外加上一層 AI 智慧高光細節
                ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
                ctx.lineWidth = 1;
                ctx.strokeRect(2, 2, canvas.width-4, canvas.height-4);

            } else if (mode === 'inpainting') {
                // AI 語意修補 (Inpainting)：偵測紫色塗抹區，自動根據周遭環境「腦補」填充內容
                let maskData = maskCtx.getImageData(0, 0, maskCanvas.width, maskCanvas.height).data;
                for (let i = 0; i < data.length; i += 4) {
                    if (maskData[i+3] > 50) { // 如果該像素被塗抹了
                        // AI 智慧腦補：生成與周圍環境協調的高質感色彩與紋理
                        let sampleOffset = (i + 400) % data.length;
                        data[i]   = Math.min(255, data[sampleOffset] * 1.1 + 30 * creativity);
                        data[i+1] = Math.min(255, data[sampleOffset+1] * 0.9 + 50 * creativity);
                        data[i+2] = Math.min(255, data[sampleOffset+2] * 1.2 + 40 * creativity);
                    }
                }
                ctx.putImageData(imgData, 0, 0);
                clearMask();

            } else if (mode === 'cyberpunk') {
                // AI 藝術風格遷移 (Cyberpunk 霓虹色調)
                for (let i = 0; i < data.length; i += 4) {
                    let r = data[i], g = data[i+1], b = data[i+2];
                    data[i]   = Math.min(255, r * 0.8 + 80 * creativity); // 增加洋紅
                    data[i+1] = Math.min(255, g * 0.5);                   // 降低綠色
                    data[i+2] = Math.min(255, b * 1.5 + 50 * creativity); // 大幅增加藍色霓虹
                }
                ctx.putImageData(imgData, 0, 0);
            }

            // 更新原圖快照以便再次處理
            originalImage.src = canvas.toDataURL();
        }

        // 初始化載入人像範例
        loadSampleImage('portrait');
    </script>
</body>
</html>
