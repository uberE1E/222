<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>萬級 Q-Learning AI 賽車大戰 (上限 10,000 輛)</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background-color: #0d0d0d;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        header {
            margin: 5px 0;
            text-align: center;
        }
        h1 {
            margin: 0;
            font-size: 20px;
            color: #f1c40f;
            text-shadow: 0 0 10px rgba(241, 196, 15, 0.4);
        }
        .subtitle {
            font-size: 11px;
            color: #888;
            margin-top: 1px;
        }
        #mainContainer {
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }
        #canvasWrapper {
            position: relative;
        }
        canvas {
            border: 3px solid #333;
            background-color: #151515;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8);
            border-radius: 6px;
            cursor: crosshair;
        }
        #controlPanel {
            width: 320px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            max-height: 580px;
            overflow-y: auto;
        }
        .panel-section {
            background: #222;
            padding: 8px 10px;
            border-radius: 6px;
            border-left: 4px solid #3498db;
        }
        .panel-section.edit-mode {
            border-left-color: #e67e22;
        }
        .panel-section h3 {
            margin: 0 0 6px 0;
            font-size: 13px;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 3px;
            color: #bbb;
        }
        .stat-val {
            font-weight: bold;
            color: #2ecc71;
        }
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            margin-top: 4px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover { background-color: #2980b9; }
        button.active { background-color: #e67e22 !important; }
        button.secondary { background-color: #4a4a4a; }
        button.danger { background-color: #e74c3c; }
        button.success { background-color: #2ecc71; }
        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
            font-size: 11px;
            margin-top: 4px;
            color: #aaa;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #3498db;
        }
        .instructions {
            font-size: 10px;
            color: #888;
            line-height: 1.3;
            background: #121212;
            padding: 6px;
            border-radius: 4px;
        }
        kbd {
            background: #333;
            color: #fff;
            padding: 1px 3px;
            border-radius: 3px;
            font-size: 9px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🏎️ 萬級 Q-Learning AI 賽車大戰 (支援高達 10,000 輛)</h1>
        <div class="subtitle">極高效能模擬核心 • 支援自訂賽道與萬車同屏競速</div>
    </header>

    <div id="mainContainer">
        <div id="canvasWrapper">
            <canvas id="simCanvas" width="850" height="580"></canvas>
        </div>

        <div id="controlPanel">
            <!-- 賽道編輯模式 -->
            <div class="panel-section edit-mode">
                <h3>🛠️ 賽道編輯工具</h3>
                <div class="btn-group">
                    <button id="toolWallBtn" class="active" onclick="setEditTool('wall')">🧱 繪製牆壁</button>
                    <button id="toolStartBtn" onclick="setEditTool('start')">🚩 設定起點</button>
                    <button id="toolFinishBtn" onclick="setEditTool('finish')">🏁 設定終點</button>
                    <button id="toolEraseBtn" onclick="setEditTool('erase')">🧹 橡皮擦</button>
                </div>
                <div class="btn-group" style="margin-top: 5px;">
                    <button class="secondary" onclick="clearTrack()">清空賽道</button>
                    <button class="secondary" onclick="loadPresetTrack()">載入預設賽道</button>
                </div>
            </div>

            <!-- 車輛數量控制 (最高 10,000) -->
            <div class="panel-section">
                <h3>🚗 賽車數量設定 (上限 1万)</h3>
                <div class="slider-group">
                    <label>車輛總數: <span id="agentCountTxt" class="stat-val">500</span> 輛</label>
                    <input type="range" id="agentCountRange" min="10" max="10000" step="10" value="500" oninput="updateAgentCount(this.value)">
                </div>
                <div class="btn-group" style="margin-top: 6px;">
                    <button class="success" onclick="updateAgentCount(1000)">設為 1,000 輛</button>
                    <button class="danger" onclick="updateAgentCount(10000)">🔥 設為 10,000 輛</button>
                </div>
            </div>

            <!-- AI 學習與訓練參數 -->
            <div class="panel-section">
                <h3>🧠 AI 訓練超參數</h3>
                <div class="slider-group">
                    <label>學習率 (Alpha): <span id="alphaTxt">0.2</span></label>
                    <input type="range" id="alphaRange" min="0.05" max="0.8" step="0.05" value="0.2">
                </div>
                <div class="slider-group">
                    <label>探索率 (Epsilon): <span id="epsTxt">0.15</span></label>
                    <input type="range" id="epsRange" min="0.0" max="0.8" step="0.05" value="0.15">
                </div>
                <div class="btn-group" style="margin-top: 6px;">
                    <button class="secondary" onclick="saveBrain()">💾 存檔大腦</button>
                    <button class="danger" onclick="clearBrain()">🗑️ 清空記憶</button>
                </div>
            </div>

            <!-- 戰況統計 -->
            <div class="panel-section">
                <h3>📊 即時戰況數據</h3>
                <div class="stat-row"><span>當前世代 (Gen):</span> <span id="genVal" class="stat-val">1</span></div>
                <div class="stat-row"><span>存活賽車:</span> <span id="aliveVal" class="stat-val">0 / 0</span></div>
                <div class="stat-row"><span>到達終點總次數:</span> <span id="winCountVal" class="stat-val">0</span></div>
                <div class="stat-row"><span>記憶庫狀態數:</span> <span id="qStatesVal" class="stat-val">0</span></div>
            </div>

            <div class="instructions">
                <strong>💡 效能提示：</strong><br>
                將車輛拉到 10,000 輛時，系統會自動切換為高密度點陣渲染以維持流暢度。你可以隨時利用滑鼠繪製專屬障礙賽道！
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("simCanvas");
        const ctx = canvas.getContext("2d");

        const genValEl = document.getElementById("genVal");
        const aliveValEl = document.getElementById("aliveVal");
        const winCountValEl = document.getElementById("winCountVal");
        const qStatesValEl = document.getElementById("qStatesVal");
        const alphaRange = document.getElementById("alphaRange");
        const epsRange = document.getElementById("epsRange");

        let ALPHA = parseFloat(alphaRange.value);
        let EPSILON = parseFloat(epsRange.value);
        let numAgents = 500;

        alphaRange.oninput = (e) => { ALPHA = parseFloat(e.target.value); document.getElementById("alphaTxt").innerText = ALPHA; };
        epsRange.oninput = (e) => { EPSILON = parseFloat(e.target.value); document.getElementById("epsTxt").innerText = EPSILON; };

        let editTool = 'wall';
        let isMouseDown = false;
        let startPoint = { x: 100, y: 500, angle: -Math.PI / 2 };
        let finishArea = { x: 700, y: 50, w: 100, h: 100 };
        let walls = [];

        let generation = 1;
        let totalWins = 0;
        let qTable = JSON.parse(localStorage.getItem("massive_race_q_table")) || {};
        let agents = [];

        function saveBrain() {
            localStorage.setItem("massive_race_q_table", JSON.stringify(qTable));
            alert("💾 AI 大腦記憶已成功儲存！");
        }

        function clearBrain() {
            if (confirm("⚠️ 確定要清空所有 AI 的記憶嗎？")) {
                qTable = {};
                localStorage.removeItem("massive_race_q_table");
                generation = 1;
                totalWins = 0;
                resetSimulation();
            }
        }

        function setEditTool(tool) {
            editTool = tool;
            document.querySelectorAll('.edit-mode button').forEach(b => b.classList.remove('active'));
            if (tool === 'wall') document.getElementById('toolWallBtn').classList.add('active');
            if (tool === 'start') document.getElementById('toolStartBtn').classList.add('active');
            if (tool === 'finish') document.getElementById('toolFinishBtn').classList.add('active');
            if (tool === 'erase') document.getElementById('toolEraseBtn').classList.add('active');
        }

        function loadPresetTrack() {
            walls = [];
            let w = canvas.width;
            let h = canvas.height;
            addWallBox(15, 15, w - 30, h - 30);
            addWallBox(160, 140, w - 320, h - 280);
            startPoint = { x: 90, y: 500, angle: -Math.PI / 2 };
            finishArea = { x: 700, y: 430, w: 100, h: 100 };
            resetSimulation();
        }

        function clearTrack() {
            walls = [];
            addWallBox(10, 10, canvas.width - 20, canvas.height - 20);
            resetSimulation();
        }

        function addWallBox(x, y, bw, bh) {
            walls.push({ x1: x, y1: y, x2: x + bw, y2: y });
            walls.push({ x1: x + bw, y1: y, x2: x + bw, y2: y + bh });
            walls.push({ x1: x + bw, y1: y + bh, x2: x, y2: y + bh });
            walls.push({ x1: x, y1: y + bh, x2: x, y1: y });
        }

        let lastMousePos = null;
        canvas.addEventListener('mousedown', (e) => {
            isMouseDown = true;
            let rect = canvas.getBoundingClientRect();
            let mx = e.clientX - rect.left;
            let my = e.clientY - rect.top;

            if (editTool === 'start') {
                startPoint.x = mx; startPoint.y = my; resetSimulation();
            } else if (editTool === 'finish') {
                finishArea.x = mx - 50; finishArea.y = my - 50;
            } else if (editTool === 'erase') {
                walls = walls.filter(w => distToSegment({x: mx, y: my}, {x: w.x1, y: w.y1}, {x: w.x2, y: w.y2}) > 20);
            }
            lastMousePos = { x: mx, y: my };
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isMouseDown) return;
            let rect = canvas.getBoundingClientRect();
            let mx = e.clientX - rect.left;
            let my = e.clientY - rect.top;

            if (editTool === 'wall' && lastMousePos) {
                if (Math.hypot(mx - lastMousePos.x, my - lastMousePos.y) > 15) {
                    walls.push({ x1: lastMousePos.x, y1: lastMousePos.y, x2: mx, y2: my });
                    lastMousePos = { x: mx, y: my };
                }
            } else if (editTool === 'erase') {
                walls = walls.filter(w => distToSegment({x: mx, y: my}, {x: w.x1, y: w.y1}, {x: w.x2, y: w.y2}) > 20);
            }
        });

        window.addEventListener('mouseup', () => { isMouseDown = false; lastMousePos = null; });

        function distToSegment(p, v, w) {
            let l2 = (w.x - v.x) ** 2 + (w.y - v.y) ** 2;
            if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
            let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
        }

        function getLineIntersection(x1, y1, x2, y2, x3, y3, x4, y4) {
            let denom = (y4 - y3) * (x2 - x1) - (x4 - x3) * (y2 - y1);
            if (denom === 0) return null;
            let ua = ((x4 - x3) * (y1 - y3) - (y4 - y3) * (x1 - x3)) / denom;
            let ub = ((x2 - x1) * (y1 - y3) - (y2 - y1) * (x1 - x3)) / denom;
            if (ua >= 0 && ua <= 1 && ub >= 0 && ub <= 1) {
                return { distFrac: ua };
            }
            return null;
        }

        class Car {
            constructor() {
                this.color = `hsl(${Math.random() * 360}, 80%, 60%)`;
                this.reset();
            }

            reset() {
                this.x = startPoint.x + (Math.random() - 0.5) * 30;
                this.y = startPoint.y + (Math.random() - 0.5) * 30;
                this.angle = startPoint.angle + (Math.random() - 0.5) * 0.2;
                this.speed = 0;
                this.maxSpeed = 4.5;
                this.isAlive = true;
                this.hasWon = false;
                this.radius = 6;
                this.lastStateKey = null;
                this.lastAction = null;
            }

            // 簡化為 3 道高效感測器以支援萬級運算
            getSensors() {
                let angles = [-Math.PI/4, 0, Math.PI/4];
                let readings = [];
                for (let a of angles) {
                    let rayAngle = this.angle + a;
                    let rx2 = this.x + Math.cos(rayAngle) * 80;
                    let ry2 = this.y + Math.sin(rayAngle) * 80;
                    let minDist = 80;

                    for (let w of walls) {
                        let hit = getLineIntersection(this.x, this.y, rx2, ry2, w.x1, w.y1, w.x2, w.y2);
                        if (hit && hit.distFrac * 80 < minDist) {
                            minDist = hit.distFrac * 80;
                        }
                    }
                    if (minDist < 25) readings.push(0);
                    else if (minDist < 50) readings.push(1);
                    else readings.push(2);
                }
                return readings;
            }

            getStateKey() {
                let s = this.getSensors();
                return `${s[0]}_${s[1]}_${s[2]}`;
            }

            chooseAction(stateKey) {
                if (!qTable[stateKey]) qTable[stateKey] = { 0: 0, 1: 0, 2: 0, 3: 0 };
                if (Math.random() < EPSILON) return Math.floor(Math.random() * 4);
                let act = qTable[stateKey];
                let bestA = 0, maxQ = -99999;
                for (let a = 0; a < 4; a++) {
                    if (act[a] > maxQ) { maxQ = act[a]; bestA = a; }
                }
                return bestA;
            }

            update() {
                if (!this.isAlive || this.hasWon) return;

                let stateKey = this.getStateKey();
                let action = this.chooseAction(stateKey);

                if (action === 0) this.angle -= 0.08;
                else if (action === 1) this.angle += 0.08;
                else if (action === 2) this.speed = Math.min(this.maxSpeed, this.speed + 0.3);
                else if (action === 3) this.speed = Math.max(1, this.speed - 0.2);

                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;

                let hitWall = false;
                for (let w of walls) {
                    if (distToSegment({x: this.x, y: this.y}, {x: w.x1, y: w.y1}, {x: w.x2, y: w.y2}) < this.radius) {
                        hitWall = true;
                        break;
                    }
                }

                if (this.x >= finishArea.x && this.x <= finishArea.x + finishArea.w &&
                    this.y >= finishArea.y && this.y <= finishArea.y + finishArea.h) {
                    this.hasWon = true;
                    totalWins++;
                }

                if (hitWall) this.isAlive = false;

                let reward = hitWall ? -100 : (this.hasWon ? 300 : 1.0 + this.speed * 0.4);
                let nextStateKey = this.getStateKey();

                if (this.lastStateKey !== null && this.lastAction !== null) {
                    if (!qTable[this.lastStateKey]) qTable[this.lastStateKey] = { 0: 0, 1: 0, 2: 0, 3: 0 };
                    if (!qTable[nextStateKey]) qTable[nextStateKey] = { 0: 0, 1: 0, 2: 0, 3: 0 };
                    let oldQ = qTable[this.lastStateKey][this.lastAction];
                    let maxNextQ = Math.max(...Object.values(qTable[nextStateKey]));
                    qTable[this.lastStateKey][this.lastAction] = oldQ + ALPHA * (reward + 0.85 * maxNextQ - oldQ);
                }

                this.lastStateKey = stateKey;
                this.lastAction = action;
            }

            draw() {
                if (!this.isAlive) return;
                ctx.fillStyle = this.color;
                // 萬級數量採用極速矩形點陣渲染
                ctx.fillRect(this.x - 2, this.y - 2, 4, 4);
            }
        }

        function updateAgentCount(val) {
            numAgents = parseInt(val);
            document.getElementById("agentCountTxt").innerText = numAgents;
            resetSimulation();
        }

        function resetSimulation() {
            agents = [];
            for (let i = 0; i < numAgents; i++) {
                agents.push(new Car());
            }
        }

        loadPresetTrack();

        function gameLoop() {
            let aliveCount = 0;
            for (let agent of agents) {
                if (agent.isAlive && !agent.hasWon) {
                    agent.update();
                    aliveCount++;
                }
            }

            if (aliveCount === 0) {
                generation++;
                resetSimulation();
            }

            // 渲染
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 終點
            ctx.fillStyle = "rgba(39, 174, 96, 0.4)";
            ctx.fillRect(finishArea.x, finishArea.y, finishArea.w, finishArea.h);

            // 牆壁
            ctx.strokeStyle = "#e74c3c";
            ctx.lineWidth = 4;
            for (let w of walls) {
                ctx.beginPath();
                ctx.moveTo(w.x1, w.y1);
                ctx.lineTo(w.x2, w.y2);
                ctx.stroke();
            }

            // 車輛
            for (let agent of agents) {
                agent.draw();
            }

            genValEl.innerText = generation;
            aliveValEl.innerText = `${aliveCount} / ${numAgents}`;
            winCountValEl.innerText = totalWins;
            qStatesValEl.innerText = Object.keys(qTable).length;

            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
