<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenAI 3D 躲貓貓 AI 模擬器 (Multi-Agent Hide and Seek)</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background-color: #0b0f19;
            color: #f0f4f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        h1 {
            margin: 4px 0;
            font-size: 20px;
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }
        .subtitle {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 6px;
        }
        #mainContainer {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }
        #canvasContainer {
            position: relative;
            border: 3px solid #1e293b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        #controlPanel {
            width: 280px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .panel-section {
            background: #0f172a;
            padding: 8px 10px;
            border-radius: 6px;
            border-left: 4px solid #38bdf8;
        }
        .panel-section h3 {
            margin: 0 0 6px 0;
            font-size: 13px;
            color: #fff;
            display: flex;
            justify-content: space-between;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            margin-bottom: 3px;
            color: #cbd5e1;
        }
        .stat-val { font-weight: bold; color: #10b981; }
        button {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 4px;
            transition: all 0.2s;
        }
        button:hover { background-color: #0369a1; }
        button.secondary { background-color: #475569; }
        button.secondary:hover { background-color: #64748b; }
        .instructions {
            font-size: 10px;
            color: #94a3b8;
            line-height: 1.4;
            background: #0f172a;
            padding: 8px;
            border-radius: 4px;
        }
    </style>
    <!-- 引入 Three.js 3D 渲染庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <h1>🤖 OpenAI 3D 躲貓貓 AI 模擬器</h1>
    <div class="subtitle">模擬多代理智慧體 (Multi-Agent) 學習築牆防禦與搜尋對抗</div>

    <div id="mainContainer">
        <div id="canvasContainer"></div>

        <div id="controlPanel">
            <div class="panel-section">
                <h3>🎮 模擬器控制</h3>
                <button onclick="resetSimulation()">🔄 重新開始模擬</button>
                <button class="secondary" onclick="togglePause()">⏸️ 暫停 / 播放</button>
            </div>

            <div class="panel-section">
                <h3>📊 3D 戰況統計</h3>
                <div class="stat-row"><span>模擬回合 (Round):</span> <span id="roundVal" class="stat-val">1</span></div>
                <div class="stat-row"><span>躲藏者 (Hiders):</span> <span id="hiderVal" class="stat-val">3 (藍色)</span></div>
                <div class="stat-row"><span>尋找者 (Seekers):</span> <span id="seekerVal" class="stat-val">2 (紅色)</span></div>
                <div class="stat-row"><span>箱子/障礙物:</span> <span id="boxVal" class="stat-val">4</span></div>
            </div>

            <div class="instructions">
                <strong>🕹️ 3D 視角操作：</strong><br>
                • 模擬器會自動從上帝視角觀看 3D 競技場。<br>
                • <strong>藍色方（Hiders）</strong>會自動移動並推動箱子圍成防禦基地。<br>
                • <strong>紅色方（Seekers）</strong>會尋找突破口追捕藍色方。
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer;
        let hiders = [], seekers = [], boxes = [], walls = [];
        let isPaused = false;
        let roundCount = 1;

        const arenaSize = 30;

        function init3D() {
            const container = document.getElementById("canvasContainer");
            
            // 建立 3D 場景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            scene.fog = new THREE.Fog(0x0f172a, 35, 75);

            // 攝影機
            camera = new THREE.PerspectiveCamera(50, 750 / 480, 0.1, 1000);
            camera.position.set(0, 32, 28);
            camera.lookAt(0, 0, 0);

            // 渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(750, 480);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // 光照設定
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // 地板
            const floorGeo = new THREE.PlaneGeometry(arenaSize, arenaSize);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // 邊界牆壁
            createWalls();

            // 建立代理與箱子
            resetEntities();

            animate();
        }

        function createWalls() {
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x334155 });
            const thickness = 1;
            const h = 4;

            const wallGeos = [
                { w: arenaSize, d: thickness, x: 0, z: -arenaSize/2 },
                { w: arenaSize, d: thickness, x: 0, z: arenaSize/2 },
                { w: thickness, d: arenaSize, x: -arenaSize/2, z: 0 },
                { w: thickness, d: arenaSize, x: arenaSize/2, z: 0 }
            ];

            wallGeos.forEach(wg => {
                const geo = new THREE.BoxGeometry(wg.w, h, wg.d);
                const mesh = new THREE.Mesh(geo, wallMat);
                mesh.position.set(wg.x, h/2, wg.z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);
                walls.push(mesh);
            });
        }

        function resetEntities() {
            // 清除舊物件
            [...hiders, ...seekers, ...boxes].forEach(obj => scene.remove(obj.mesh));
            hiders = [];
            seekers = [];
            boxes = [];

            // 1. 建立箱子 (可被推動的 3D 方塊)
            const boxGeo = new THREE.BoxGeometry(3, 3, 3);
            const boxMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.4 });
            for (let i = 0; i < 4; i++) {
                const mesh = new THREE.Mesh(boxGeo, boxMat);
                mesh.position.set((Math.random() - 0.5) * 10, 1.5, (Math.random() - 0.5) * 10);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);
                boxes.push({ mesh, vx: 0, vz: 0 });
            }

            // 2. 建立躲藏者 (Hiders - 藍色)
            const hiderGeo = new THREE.SphereGeometry(1.2, 16, 16);
            const hiderMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.3 });
            for (let i = 0; i < 3; i++) {
                const mesh = new THREE.Mesh(hiderGeo, hiderMat);
                mesh.position.set(-10 + (Math.random() - 0.5) * 4, 1.2, -10 + (Math.random() - 0.5) * 4);
                mesh.castShadow = true;
                scene.add(mesh);
                hiders.push({ mesh, vx: (Math.random()-0.5)*0.1, vz: (Math.random()-0.5)*0.1 });
            }

            // 3. 建立尋找者 (Seekers - 紅色)
            const seekerGeo = new THREE.ConeGeometry(1.3, 3, 16);
            const seekerMat = new THREE.MeshStandardMaterial({ color: 0xf43f5e, roughness: 0.3 });
            for (let i = 0; i < 2; i++) {
                const mesh = new THREE.Mesh(seekerGeo, seekerMat);
                mesh.rotation.x = Math.PI / 2;
                mesh.position.set(10 + (Math.random() - 0.5) * 4, 1.5, 10 + (Math.random() - 0.5) * 4);
                mesh.castShadow = true;
                scene.add(mesh);
                seekers.push({ mesh, vx: (Math.random()-0.5)*0.1, vz: (Math.random()-0.5)*0.1 });
            }
        }

        function resetSimulation() {
            roundCount++;
            document.getElementById("roundVal").innerText = roundCount;
            resetEntities();
        }

        function togglePause() {
            isPaused = !isPaused;
        }

        // 3D 物理與 AI 行為邏輯
        function updateAI() {
            if (isPaused) return;

            // 躲藏者行為：聚集並推動箱子組成防禦基地
            hiders.forEach(h => {
                h.mesh.position.x += h.vx;
                h.mesh.position.z += h.vz;

                // 隨機轉向與邊界碰撞
                if (Math.abs(h.mesh.position.x) > arenaSize/2 - 3) h.vx *= -1;
                if (Math.abs(h.mesh.position.z) > arenaSize/2 - 3) h.vz *= -1;
                if (Math.random() < 0.02) {
                    h.vx = (Math.random() - 0.5) * 0.12;
                    h.vz = (Math.random() - 0.5) * 0.12;
                }

                // 箱子推動互動
                boxes.forEach(b => {
                    let dist = h.mesh.position.distanceTo(b.mesh.position);
                    if (dist < 2.5) {
                        b.mesh.position.x += h.vx * 1.5;
                        b.mesh.position.z += h.vz * 1.5;
                    }
                });
            });

            // 尋找者行為：追逐躲藏者
            seekers.forEach(s => {
                // 尋找最近的躲藏者
                let target = hiders[0].mesh.position;
                let minDist = s.mesh.position.distanceTo(target);
                hiders.forEach(h => {
                    let d = s.mesh.position.distanceTo(h.mesh.position);
                    if (d < minDist) { minDist = d; target = h.mesh.position; }
                });

                // 朝目標移動
                let dx = target.x - s.mesh.position.x;
                let dz = target.z - s.mesh.position.z;
                let len = Math.hypot(dx, dz);
                if (len > 0.1) {
                    s.mesh.position.x += (dx / len) * 0.08;
                    s.mesh.position.z += (dz / len) * 0.08;
                }

                // 尋找者撞擊箱子可以推開箱子
                boxes.forEach(b => {
                    let dist = s.mesh.position.distanceTo(b.mesh.position);
                    if (dist < 2.5) {
                        b.mesh.position.x += (dx / len) * 0.1;
                        b.mesh.position.z += (dz / len) * 0.1;
                    }
                });
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            updateAI();
            renderer.render(scene, camera);
        }

        window.onload = init3D;
    </script>
</body>
</html>
