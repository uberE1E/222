<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>經典貪吃蛇遊戲 (具備關閉防護機制)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        canvas { background-color: #0f172a; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-6 flex flex-col items-center">
        
        <div class="w-full flex justify-between items-center mb-4">
            <h1 class="text-xl font-bold text-cyan-400 flex items-center gap-2">
                <span>🐍</span> 貪吃蛇大作戰
            </h1>
            <div class="text-sm bg-slate-800 px-3 py-1 rounded-lg border border-slate-700">
                得分: <span id="score" class="text-emerald-400 font-bold">0</span>
            </div>
        </div>

        <!-- 遊戲畫布 -->
        <canvas id="gameCanvas" width="360" height="360" class="rounded-xl border border-slate-800 mb-4"></canvas>

        <!-- 控制說明 -->
        <div class="text-xs text-slate-400 text-center mb-4 bg-slate-950 p-3 rounded-xl border border-slate-800 w-full">
            使用鍵盤方向鍵 <span class="text-cyan-400 font-bold">↑ ↓ ← →</span> 控制方向<br>
            關閉網頁或重新整理時將會觸發安全確認防護！
        </div>

        <button onclick="resetGame()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 px-4 rounded-xl transition shadow-lg shadow-emerald-900/25">
            重新開始遊戲
        </button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let food = { x: 5, y: 5 };
        let dx = 1;
        let dy = 0;
        let score = 0;
        let gameInterval = null;
        let isGameStarted = true;

        // 【防關閉網頁機制】當遊戲進行中時，嘗試關閉分頁會彈出確認提示
        window.addEventListener('beforeunload', function (e) {
            if (isGameStarted) {
                e.preventDefault();
                e.returnValue = '遊戲正在進行中！確定要離開或關閉網頁嗎？';
                return e.returnValue;
            }
        });

        // 監聽鍵盤方向鍵
        document.addEventListener('keydown', changeDirection);

        function changeDirection(event) {
            const keyPressed = event.keyCode;
            const LEFT = 37, UP = 38, RIGHT = 39, DOWN = 40;
            const A = 65, W = 87, D = 68, S = 83;

            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            if ((keyPressed === LEFT || keyPressed === A) && !goingRight) { dx = -1; dy = 0; }
            if ((keyPressed === UP || keyPressed === W) && !goingDown) { dx = 0; dy = -1; }
            if ((keyPressed === RIGHT || keyPressed === D) && !goingLeft) { dx = 1; dy = 0; }
            if ((keyPressed === DOWN || keyPressed === S) && !goingUp) { dx = 0; dy = 1; }
        }

        function main() {
            if (hasGameEnded()) {
                alert('遊戲結束！你的最終得分是: ' + score);
                resetGame();
                return;
            }

            setTimeout(() => {
                clearCanvas();
                drawFood();
                moveSnake();
                drawSnake();
                main();
            }, 100);
        }

        function clearCanvas() {
            ctx.fillStyle = "#0f172a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? "#38bdf8" : "#0ea5e9";
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('score').innerText = score;
                generateFood();
            } else {
                snake.pop();
            }
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) generateFood();
            });
        }

        function drawFood() {
            ctx.fillStyle = "#f43f5e";
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
        }

        function hasGameEnded() {
            const head = snake[0];
            const hitLeftWall = head.x < 0;
            const hitRightWall = head.x >= tileCount;
            const hitToptWall = head.y < 0;
            const hitBottomWall = head.y >= tileCount;

            if (hitLeftWall || hitRightWall || hitToptWall || hitBottomWall) return true;

            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) return true;
            }
            return false;
        }

        function resetGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            dx = 1;
            dy = 0;
            score = 0;
            document.getElementById('score').innerText = score;
            generateFood();
        }

        generateFood();
        main();
    </script>
</body>
</html>
